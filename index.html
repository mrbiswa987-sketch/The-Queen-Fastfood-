<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Queen Fast Food</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #120000, #300000, #090909);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 38px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #e50914;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      color: #111;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .tagline {
      color: #777;
      font-size: 14px;
      margin-bottom: 32px;
    }

    h2 {
      font-size: 21px;
      color: #222;
      margin-bottom: 20px;
    }

    .phone-box {
      display: flex;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .country {
      background: #f3f3f3;
      padding: 15px;
      font-weight: bold;
      color: #333;
    }

    .phone-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 15px;
      font-size: 16px;
    }

    .main-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: #e50914;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-btn:hover {
      background: #bd0009;
    }

    .otp-section {
      display: none;
    }

    .otp-section input {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      letter-spacing: 8px;
      outline: none;
      margin-bottom: 18px;
    }

    .back-btn {
      margin-top: 12px;
      border: none;
      background: none;
      color: #e50914;
      cursor: pointer;
      font-size: 14px;
    }

    .footer {
      margin-top: 28px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">Q</div>

    <h1>The Queen Fast Food</h1>

    <p class="tagline">
      Fresh Food • Fast Service • Happy Moments
    </p>


    <!-- MOBILE LOGIN -->

    <div id="phoneSection">

      <h2>Welcome 👋</h2>

      <div class="phone-box">

        <div class="country">+91</div>

        <input
          type="tel"
          id="phone"
          placeholder="Mobile Number"
          maxlength="10"
        >

      </div>

      <button class="main-btn" onclick="sendOTP()">
        Continue
      </button>

    </div>


    <!-- OTP -->

    <div class="otp-section" id="otpSection">

      <h2>Verify Your Number</h2>

      <p style="color:#777; margin-bottom:20px;">
        Enter the 6-digit OTP sent to your mobile.
      </p>

      <input
        type="text"
        id="otp"
        placeholder="••••••"
        maxlength="6"
      >

      <button class="main-btn" onclick="verifyOTP()">
        Verify & Continue
      </button>

      <button class="back-btn" onclick="goBack()">
        ← Change Mobile Number
      </button>

    </div>


    <div class="footer">
      © 2026 The Queen Fast Food
    </div>

  </div>


  <script>

    function sendOTP() {

      const phone = document.getElementById("phone").value;

      if (phone.length !== 10) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
      }

      document.getElementById("phoneSection").style.display = "none";

      document.getElementById("otpSection").style.display = "block";
    }


    function verifyOTP() {

      const otp = document.getElementById("otp").value;

      if (otp.length !== 6) {
        alert("Please enter the 6-digit OTP.");
        return;
      }

      alert("Login successful!");

    }


    function goBack() {

      document.getElementById("otpSection").style.display = "none";

      document.getElementById("phoneSection").style.display = "block";

    }

  </script>

</body>
</html>
