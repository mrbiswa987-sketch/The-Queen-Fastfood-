<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Queen Fast Food</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #120000, #3b0000, #080000);
      color: white;
    }

    .box {
      width: 90%;
      max-width: 400px;
      padding: 30px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }

    h1 {
      color: #ff3b30;
      margin-bottom: 8px;
    }

    p {
      color: #ddd;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #e50914;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff1a25;
    }

    #otpSection {
      display: none;
    }

    #recaptcha-container {
      margin-top: 15px;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      color: #ffd166;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>The Queen Fast Food</h1>
    <p>Order your favourite food 🍔</p>

    <div id="phoneSection">

      <input
        type="tel"
        id="phone"
        placeholder="Enter 10 digit mobile number"
        maxlength="10"
      >

      <div id="recaptcha-container"></div>

      <button onclick="sendOTP()">Send OTP</button>

    </div>

    <div id="otpSection">

      <input
        type="text"
        id="otp"
        placeholder="Enter 6 digit OTP"
        maxlength="6"
      >

      <button onclick="verifyOTP()">Verify OTP</button>

    </div>

    <div id="message"></div>

  </div>


  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyBtJaMwLBSJP2d6QXa3ZRXkGIonok-erQg",
  authDomain: "the-queen-fast-food.firebaseapp.com",
  projectId: "the-queen-fast-food",
  storageBucket: "the-queen-fast-food.firebasestorage.app",
  messagingSenderId: "435721389652",
  appId: "1:435721389652:web:95d7dd2bd976cbadb50fc1",
  measurementId: "G-CK3PTPKPBN"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let confirmationResult = null;
let recaptchaVerifier = null;


// SEND OTP
window.sendOTP = async function () {

  const phone = document.getElementById("phone").value.trim();
  const message = document.getElementById("message");

  if (!/^[0-9]{10}$/.test(phone)) {
    message.innerText = "Please enter a valid 10 digit mobile number.";
    return;
  }

  const phoneNumber = "+91" + phone;

  try {

    message.innerText = "Loading verification...";

    // Create reCAPTCHA only once
    if (!recaptchaVerifier) {

      recaptchaVerifier = new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        {
          size: "normal",
          callback: () => {
            console.log("reCAPTCHA completed");
          },
          "expired-callback": () => {
            message.innerText = "reCAPTCHA expired. Please try again.";
          }
        }
      );
    }

    confirmationResult = await signInWithPhoneNumber(
      auth,
      phoneNumber,
      recaptchaVerifier
    );

    document.getElementById("phoneSection").style.display = "none";
    document.getElementById("otpSection").style.display = "block";

    message.innerText = "OTP sent successfully. Check your SMS.";

  } catch (error) {

    console.error(error);

    message.innerText =
      "OTP failed: " + error.code;

    if (recaptchaVerifier) {
      recaptchaVerifier.clear();
      recaptchaVerifier = null;
    }
  }
};


// VERIFY OTP
window.verifyOTP = async function () {

  const otp = document.getElementById("otp").value.trim();
  const message = document.getElementById("message");

  if (!/^[0-9]{6}$/.test(otp)) {
    message.innerText = "Please enter the 6 digit OTP.";
    return;
  }

  if (!confirmationResult) {
    message.innerText = "Please request OTP first.";
    return;
  }

  try {

    await confirmationResult.confirm(otp);

    message.innerText = "Login successful! 🎉";

    // Temporary:
    // home.html ame pare create kariba
    setTimeout(() => {
      message.innerText = "Welcome to The Queen Fast Food 🍔";
    }, 1000);

  } catch (error) {

    console.error(error);

    message.innerText =
      "Invalid OTP. Please try again.";

  }
};

</script>

</body>
</html>
