<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070707">

<title>The Queen Fast Food - Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#070707;
  color:#fff;
  min-height:100vh;
}

button,input,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

:root{
  --orange:#ff7a00;
  --orange2:#ff941f;
  --black:#070707;
  --card:#111;
  --card2:#151515;
  --border:rgba(255,122,0,.20);
  --muted:#9a9a9a;
  --green:#25d366;
  --red:#ff4d4d;
}

.header{
  height:68px;
  border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,7,7,.96);
  backdrop-filter:blur(12px);
}

.brand{
  font-family:"Cormorant Garamond",serif;
  font-size:27px;
  font-weight:700;
  letter-spacing:2px;
}

.brand span{
  color:var(--orange);
}

.admin-badge{
  font-size:11px;
  color:#aaa;
  border:1px solid rgba(255,122,0,.25);
  padding:7px 10px;
  border-radius:20px;
}

.container{
  width:min(1050px,94%);
  margin:20px auto 40px;
}

.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:min(390px,100%);
  background:#101010;
  border:1px solid var(--border);
  border-radius:20px;
  padding:25px;
  box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.login-title{
  font-family:"Cormorant Garamond",serif;
  font-size:34px;
  text-align:center;
  margin-bottom:4px;
}

.login-title span{
  color:var(--orange);
}

.login-sub{
  text-align:center;
  color:#888;
  font-size:12px;
  margin-bottom:22px;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  font-size:11px;
  color:#999;
  margin-bottom:6px;
}

.field input,
.settings-input,
.price-input,
.status-select{
  width:100%;
  height:42px;
  border:1px solid rgba(255,255,255,.10);
  background:#080808;
  color:#fff;
  outline:none;
  border-radius:10px;
  padding:0 12px;
}

.field input:focus,
.settings-input:focus,
.price-input:focus{
  border-color:var(--orange);
}

.login-btn,
.primary-btn{
  width:100%;
  height:43px;
  border:0;
  border-radius:10px;
  background:var(--orange);
  color:#000;
  font-weight:800;
  margin-top:5px;
}

.login-btn:hover,
.primary-btn:hover{
  background:var(--orange2);
}

.error{
  color:#ff6b6b;
  font-size:12px;
  min-height:18px;
  margin-top:9px;
  text-align:center;
}

.hidden{
  display:none!important;
}

/* TOP */
.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.page-title{
  font-family:"Cormorant Garamond",serif;
  font-size:32px;
  font-weight:700;
}

.page-title span{
  color:var(--orange);
}

.logout-btn{
  background:#151515;
  border:1px solid rgba(255,255,255,.09);
  color:#ddd;
  border-radius:9px;
  padding:9px 13px;
  font-size:11px;
}

/* SHOP STATUS */
.shop-control{
  background:#111;
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.shop-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.shop-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#555;
}

.shop-dot.open{
  background:#25d366;
  box-shadow:0 0 12px rgba(37,211,102,.7);
}

.shop-dot.closed{
  background:#ff4d4d;
  box-shadow:0 0 12px rgba(255,77,77,.5);
}

.shop-name{
  font-size:13px;
  font-weight:700;
}

.shop-state{
  font-size:10px;
  color:#999;
  margin-top:2px;
}

.toggle{
  width:58px;
  height:30px;
  border-radius:20px;
  background:#292929;
  border:1px solid #444;
  position:relative;
  transition:.2s;
}

.toggle::after{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  top:3px;
  left:3px;
  background:#888;
  border-radius:50%;
  transition:.2s;
}

.toggle.on{
  background:rgba(37,211,102,.18);
  border-color:#25d366;
}

.toggle.on::after{
  left:31px;
  background:#25d366;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px;
}

.stat{
  background:#101010;
  border:1px solid rgba(255,255,255,.07);
  border-radius:13px;
  padding:13px;
}

.stat-label{
  color:#888;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.stat-value{
  font-size:23px;
  font-weight:800;
  margin-top:4px;
}

.stat-value.orange{
  color:var(--orange);
}

/* SECTIONS */
.section{
  background:#101010;
  border:1px solid rgba(255,255,255,.07);
  border-radius:15px;
  margin-bottom:14px;
  overflow:hidden;
}

.section-head{
  min-height:50px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 15px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.section-title{
  font-family:"Cormorant Garamond",serif;
  font-size:23px;
  font-weight:700;
}

.section-title span{
  color:var(--orange);
}

.count{
  min-width:24px;
  height:22px;
  padding:0 7px;
  border-radius:20px;
  background:rgba(255,122,0,.12);
  color:var(--orange);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:800;
}

.section-body{
  padding:10px;
}

/* ORDER CARD */
.order-card{
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.06);
  border-radius:11px;
  padding:12px;
  margin-bottom:8px;
}

.order-card:last-child{
  margin-bottom:0;
}

.order-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.order-id{
  font-size:13px;
  font-weight:800;
  color:#fff;
}

.order-date{
  font-size:9px;
  color:#777;
  margin-top:3px;
}

.status-pill{
  font-size:9px;
  font-weight:800;
  border-radius:20px;
  padding:5px 8px;
  text-transform:uppercase;
}

.status-received{
  background:rgba(255,122,0,.14);
  color:#ff9b3d;
}

.status-processing{
  background:rgba(255,190,60,.13);
  color:#ffca55;
}

.status-delivery{
  background:rgba(65,150,255,.13);
  color:#66aaff;
}

.status-delivered{
  background:rgba(37,211,102,.13);
  color:#50e58a;
}

.status-cancelled{
  background:rgba(255,77,77,.13);
  color:#ff6d6d;
}

.customer-info{
  margin-top:9px;
  font-size:11px;
  color:#aaa;
  line-height:1.55;
}

.customer-info strong{
  color:#eee;
}

.order-items{
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid rgba(255,255,255,.05);
}

.order-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:#bbb;
  font-size:10px;
  padding:2px 0;
}

.order-total{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid rgba(255,255,255,.05);
  font-size:13px;
  font-weight:800;
}

.order-total span:last-child{
  color:var(--orange);
}

.order-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px;
}

.action-btn{
  border:1px solid rgba(255,255,255,.10);
  background:#171717;
  color:#ddd;
  border-radius:7px;
  padding:7px 9px;
  font-size:9px;
  font-weight:800;
}

.action-btn:hover{
  border-color:var(--orange);
  color:var(--orange);
}

.action-btn.orange{
  background:var(--orange);
  color:#000;
  border-color:var(--orange);
}

.action-btn.green{
  background:rgba(37,211,102,.12);
  color:#45df80;
  border-color:rgba(37,211,102,.25);
}

.action-btn.blue{
  background:rgba(65,150,255,.12);
  color:#66aaff;
  border-color:rgba(65,150,255,.25);
}

.action-btn.red{
  background:rgba(255,77,77,.10);
  color:#ff6b6b;
  border-color:rgba(255,77,77,.20);
}

.empty{
  padding:22px 10px;
  text-align:center;
  color:#666;
  font-size:11px;
}

/* FOOD */
.food-row{
  display:grid;
  grid-template-columns:minmax(150px,1fr) 90px 110px auto;
  align-items:center;
  gap:8px;
  padding:8px;
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.05);
  border-radius:9px;
  margin-bottom:6px;
}

.food-row:last-child{
  margin-bottom:0;
}

.food-name{
  font-size:11px;
  font-weight:700;
}

.price-input{
  height:32px;
  padding:0 8px;
  font-size:11px;
}

.availability{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:9px;
  color:#999;
}

.mini-toggle{
  width:42px;
  height:23px;
  border-radius:20px;
  background:#2b2b2b;
  position:relative;
  border:1px solid #444;
  cursor:pointer;
}

.mini-toggle::after{
  content:"";
  position:absolute;
  width:17px;
  height:17px;
  left:2px;
  top:2px;
  border-radius:50%;
  background:#777;
  transition:.18s;
}

.mini-toggle.on{
  background:rgba(37,211,102,.16);
  border-color:#25d366;
}

.mini-toggle.on::after{
  left:21px;
  background:#25d366;
}

.save-food{
  height:32px;
  padding:0 10px;
  border:0;
  border-radius:7px;
  background:var(--orange);
  color:#000;
  font-size:9px;
  font-weight:800;
}

/* SETTINGS */
.settings-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.settings-box{
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.06);
  border-radius:10px;
  padding:11px;
}

.settings-box.full{
  grid-column:1/-1;
}

.settings-label{
  font-size:10px;
  color:#888;
  margin-bottom:7px;
}

.save-settings{
  width:100%;
  height:38px;
  border:0;
  border-radius:8px;
  background:var(--orange);
  color:#000;
  font-weight:800;
  font-size:10px;
}

/* SALES */
.sales-folder{
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.06);
  border-radius:10px;
  margin-bottom:7px;
  overflow:hidden;
}

.sales-folder-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px;
}

.sales-date{
  font-size:11px;
  font-weight:800;
}

.sales-info{
  font-size:9px;
  color:#888;
  margin-top:3px;
}

.sales-total{
  color:var(--orange);
  font-size:13px;
  font-weight:800;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:9999;
  background:#171717;
  border:1px solid var(--orange);
  color:#fff;
  padding:11px 14px;
  border-radius:10px;
  font-size:11px;
  transform:translateY(80px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

@media(max-width:750px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .food-row{
    grid-template-columns:1fr 80px;
  }

  .availability{
    grid-column:1;
  }

  .save-food{
    grid-column:2;
    grid-row:2;
  }

  .settings-grid{
    grid-template-columns:1fr;
  }

  .settings-box.full{
    grid-column:auto;
  }
}

@media(max-width:500px){
  .header{
    padding:0 13px;
  }

  .brand{
    font-size:21px;
  }

  .container{
    width:94%;
    margin-top:13px;
  }

  .top-row{
    margin-bottom:12px;
  }

  .page-title{
    font-size:28px;
  }

  .stats{
    gap:7px;
  }

  .stat{
    padding:10px;
  }

  .stat-value{
    font-size:20px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">

  <div class="login-box">

    <div class="login-title">
      THE <span>QUEEN</span>
    </div>

    <div class="login-sub">
      FAST FOOD ADMIN PANEL
    </div>

    <div class="field">
      <label>ADMIN EMAIL</label>
      <input id="email" type="email" placeholder="Admin email">
    </div>

    <div class="field">
      <label>PASSWORD</label>

    </div>

    <button class="login-btn" onclick="loginAdmin()">

    <div id="loginError" class="error"></div>

  </div>

</div>


<!-- ADMIN -->
<div id="adminScreen" class="hidden">

  <header class="header">

    <div class="brand">
      THE <span>QUEEN</span> FAST FOOD
    </div>

    <div class="admin-badge">
      ADMIN PANEL
    </div>

  </header>

  <main class="container">

    <div class="top-row">

      <div class="page-title">
        Admin <span>Dashboard</span>
      </div>

      <button class="logout-btn" onclick="logoutAdmin()">
        LOGOUT
      </button>

    </div>


    <!-- SHOP -->
    <div class="shop-control">

      <div class="shop-left">

        <div id="shopDot" class="shop-dot"></div>

        <div>
          <div class="shop-name">
            Shop Status
          </div>

          <div id="shopState" class="shop-state">

          </div>
        </div>

      </div>

      <button
        id="shopToggle"
        class="toggle"
        onclick="toggleShop()">
      </button>

    </div>


    <!-- STATS -->
    <div class="stats">

      <div class="stat">
        <div class="stat-label">New Orders</div>
        <div id="newCount" class="stat-value orange">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Processing</div>
        <div id="processingCount" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Delivery</div>
        <div id="deliveryCount" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Sales</div>
        <div id="salesTotal" class="stat-value orange">₹0</div>
      </div>

    </div>


    <!-- NEW ORDERS -->
    <section class="section">

      <div class="section-head">

        <div class="section-title">
          New <span>Orders</span>
        </div>

        <div id="newBadge" class="count">0</div>

      </div>

      <div id="newOrders" class="section-body"></div>

    </section>


    <!-- PROCESSING -->
    <section class="section">

      <div class="section-head">

        <div class="section-title">
          Pending <span>Orders</span>
        </div>

        <div id="pendingBadge" class="count">0</div>

      </div>

      <div id="pendingOrders" class="section-body"></div>

    </section>


    <!-- CLOSED -->
    <section class="section">

      <div class="section-head">

        <div class="section-title">
          Closed <span>Orders</span>
        </div>

        <div id="closedBadge" class="count">0</div>

      </div>

      <div id="closedOrders" class="section-body"></div>

    </section>


    <!-- FOOD ITEMS -->
    <section class="section">

      <div class="section-head">

        <div class="section-title">
          Food <span>Items</span>
        </div>

      </div>

      <div id="foodItems" class="section-body"></div>

    </section>


    <!-- SETTINGS -->
    <section class="section">

      <div class="section-head">

        <div class="section-title">
          Admin <span>Settings</span>
        </div>

      </div>

      <div class="section-body">

        <div class="settings-grid">

          <div class="settings-box full">

            <div class="settings-label">
              WHATSAPP ORDER NUMBER
            </div>

            <input
              id="whatsappNumber"
              class="settings-input"
              placeholder="9090220791">

          </div>

          <div class="settings-box full">

            <button
              class="save-settings"
              onclick="saveWhatsApp()">
              SAVE WHATSAPP NUMBER
            </button>

          </div>

        </div>

      </div>

    </section>


    <!-- SALES HISTORY -->
    <section class="section">

      <div class="section-head">

        <div class="section-title">
          Online <span>Sales</span>
        </div>

      </div>

      <div id="salesHistory" class="section-body"></div>

    </section>


    <!-- TRACK -->
    <section class="section">

      <div class="section-head">

        <div class="section-title">
          Track <span>Order</span>
        </div>

      </div>

      <div class="section-body">

        <div class="field">

          <label>ORDER ID</label>

          <input
            id="adminTrackId"
            class="settings-input"
            placeholder="Example: QF123456">

        </div>

        <button
          class="primary-btn"
          onclick="trackAdminOrder()">
          TRACK ORDER
        </button>

        <div id="adminTrackResult"></div>

      </div>

    </section>

  </main>

</div>

<div id="toast" class="toast"></div>

  loadEverything();

});


/* LOGIN */

window.loginAdmin = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("loginError");

  error.textContent = "";

  if(!email || !password){

      "Enter admin email and password.";

    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(err){

    console.error(err);

    error.textContent =
      "Invalid admin email or password.";

  }

};


/* LOGOUT */

window.logoutAdmin = async function(){

  await signOut(auth);

};


/* SCREENS */

function showLogin(){

  loginScreen.classList.remove("hidden");

  adminScreen.classList.add("hidden");

}


function showAdmin(){

  loginScreen.classList.add("hidden");

  adminScreen.classList.remove("hidden");

}


/* LOAD */

function loadEverything(){

  loadSettings();

  loadOrders();

}


/* SETTINGS REALTIME */

function loadSettings(){

  onValue(
    ref(db,"settings"),
    snapshot => {

      shopSettings =
        snapshot.val() || {};

      menuSettings =
        shopSettings.menu || {};

      shopOpen =
        shopSettings.shopOpen !== false;

      renderShop();

      renderFood();

      document.getElementById("whatsappNumber").value =
        shopSettings.whatsappNumber ||
        "9090220791";

      settingsLoaded = true;

      updateDashboard();

    },
    error => {

      console.error(
        "Settings error:",
        error
      );

      showToast(
        "Settings loading error"
      );

    }
  );

}


/* ORDERS REALTIME */

function loadOrders(){

  onValue(
    ref(db,"orders"),
    snapshot => {

      allOrders =
        snapshot.val() || {};

      ordersLoaded = true;

      renderOrders();

      updateDashboard();

      renderSales();

    },
    error => {

      console.error(
        "Orders error:",
        error
      );

      showToast(
        "Orders loading error"
      );

    }
  );

}


/* SHOP */

function renderShop(){

  const dot =
    document.getElementById("shopDot");

  const state =
    document.getElementById("shopState");

  const toggle =
    document.getElementById("shopToggle");


  if(shopOpen){

    dot.className =
      "shop-dot open";

    state.textContent =
      "SHOP OPEN";

    toggle.classList.add("on");

  }else{

    dot.className =
      "shop-dot closed";

    state.textContent =
      "SHOP CLOSED";

    toggle.classList.remove("on");

  }

}


/* TOGGLE SHOP */

window.toggleShop = async function(){

  shopOpen = !shopOpen;

  await set(
    ref(db,"settings/shopOpen"),
    shopOpen
  );

  showToast(
    shopOpen
      ? "Shop Open"
      : "Shop Closed"
  );

};


/* NORMALIZE STATUS */

function normalizeStatus(order){

  let status =
    String(order.status || "received")
      .toLowerCase();

  if(status === "new" ||
     status === "placed" ||
     status === "pending" ||
     status === "received"){

    return "received";
  }

  if(status === "processing" ||
     status === "confirmed" ||
     status === "preparing" ||
     status === "ready"){

    return "processing";
  }

  if(status === "out_for_delivery" ||
     status === "out-for-delivery" ||
     status === "delivery"){

    return "out_for_delivery";
  }

  if(status === "delivered" ||
     status === "completed" ||
     status === "closed"){

    return "delivered";
  }

  if(status === "cancelled" ||
     status === "canceled"){

    return "cancelled";
  }

  return "received";

}


/* ORDER ARRAY */

function getOrderArray(){

  return Object.entries(allOrders)
    .map(([id,order]) => ({
      id,
      ...(order || {})
    }))
    .sort(
      (a,b) =>
        Number(b.createdAt || 0) -
        Number(a.createdAt || 0)
    );

}


/* RENDER ORDERS */

function renderOrders(){

  const orders =
    getOrderArray();

  const newOrders =
    orders.filter(
      o => normalizeStatus(o) === "received"
    );

  const pendingOrders =
    orders.filter(
      o =>
        normalizeStatus(o) === "processing" ||
        normalizeStatus(o) === "out_for_delivery"
    );

  const closedOrders =
    orders.filter(
      o =>
        normalizeStatus(o) === "delivered" ||
        normalizeStatus(o) === "cancelled"
    );


  renderOrderBox(
    "newOrders",
    newOrders
  );

  renderOrderBox(
    "pendingOrders",
    pendingOrders
  );

  renderOrderBox(
    "closedOrders",
    closedOrders
  );


  document.getElementById("newBadge").textContent =
    newOrders.length;

  document.getElementById("pendingBadge").textContent =
    pendingOrders.length;

  document.getElementById("closedBadge").textContent =
    closedOrders.length;

}


/* ORDER BOX */

function renderOrderBox(elementId,orders){

  const box =
    document.getElementById(elementId);

  if(!orders.length){

    box.innerHTML =
      `<div class="empty">
        No orders here
      </div>`;

    return;
  }

  box.innerHTML =
    orders
      .map(renderOrderCard)
      .join("");

}


/* ORDER CARD */

function renderOrderCard(order){

  const status =
    normalizeStatus(order);

  let statusText =
    "ORDER RECEIVED";

  let statusClass =
    "status-received";

  if(status === "processing"){

    statusText =
      "PROCESSING";

    statusClass =
      "status-processing";

  }

  if(status === "out_for_delivery"){

    statusText =
      "OUT FOR DELIVERY";

    statusClass =
      "status-delivery";

  }

  if(status === "delivered"){

    statusText =
      "DELIVERED";

    statusClass =
      "status-delivered";

  }

  if(status === "cancelled"){

    statusText =
      "CANCELLED";

    statusClass =
      "status-cancelled";

  }


  const date =
    order.createdAt
      ? new Date(order.createdAt).toLocaleString(
          "en-IN"
        )
      : "-";


  const customer =
    order.customerName ||
    order.name ||
    "Customer";


  const phone =
    order.phone ||
    order.mobile ||
    "";


  const address =
    order.address ||
    order.deliveryAddress ||
    "Address not available";


  const items =
    Array.isArray(order.items)
      ? order.items
      : Object.values(order.items || {});


  const itemHTML =
    items.map(item => {

      const name =
        item.name ||
        "Food Item";

      const qty =
        Number(
          item.quantity ||
          item.qty ||
          1
        );

      const price =
        Number(
          item.price ||
          0
        );

      return `
        <div class="order-item">
          <span>${escapeHTML(name)} × ${qty}</span>
          <span>₹${price * qty}</span>
        </div>
      `;

    }).join("");


  const total =
    Number(
      order.total ||
      order.grandTotal ||
      order.amount ||
      0
    );


  return `
    <div class="order-card">

      <div class="order-top">

        <div>
          <div class="order-id">
            #${escapeHTML(order.id)}
          </div>

          <div class="order-date">
            ${escapeHTML(date)}
          </div>
        </div>

        <div class="status-pill ${statusClass}">
          ${statusText}
        </div>

      </div>


      <div class="customer-info">

        <strong>${escapeHTML(customer)}</strong>

        ${phone
          ? `<br>📞 ${escapeHTML(phone)}`
          : ""}

        <br>📍 ${escapeHTML(address)}

      </div>


      <div class="order-items">

        ${itemHTML || `
          <div class="order-item">
            <span>Order items</span>
            <span>-</span>
          </div>
        `}

      </div>


      <div class="order-total">

        <span>TOTAL</span>

        <span>₹${total}</span>

      </div>


      ${renderActionButtons(order.id,status)}

    </div>
  `;

}


/* ACTION BUTTONS */

function renderActionButtons(orderId,status){

  let html = `
    <div class="order-actions">
  `;


  if(status === "received"){

    html += `
      <button
        class="action-btn orange"
        onclick="changeStatus('${orderId}','processing')">
        PROCESSING
      </button>
    `;

    html += `
      <button
        class="action-btn red"
        onclick="changeStatus('${orderId}','cancelled')">
        CANCEL
      </button>
    `;

  }


  else if(status === "processing"){

    html += `
      <button
        class="action-btn blue"
        onclick="changeStatus('${orderId}','out_for_delivery')">
        OUT FOR DELIVERY
      </button>
    `;

    html += `
      <button
        class="action-btn red"
        onclick="changeStatus('${orderId}','cancelled')">
        CANCEL
      </button>
    `;

  }


  else if(status === "out_for_delivery"){

    html += `
      <button
        class="action-btn green"
        onclick="changeStatus('${orderId}','delivered')">
        DELIVERED
      </button>
    `;

  }


  html += `
      <button
        class="action-btn"
        onclick="trackOrderFromCard('${orderId}')">
        TRACK
      </button>
    </div>
  `;


  return html;

}


/* CHANGE ORDER STATUS */

window.changeStatus = async function(
  orderId,
  newStatus
){

  try{

    await update(
      ref(db,"orders/"+orderId),
      {
        status:newStatus,
        updatedAt:Date.now()
      }
    );

    showToast(
      newStatus === "processing"
        ? "Order → Processing"
        : newStatus === "out_for_delivery"
        ? "Order → Out For Delivery"
        : newStatus === "delivered"
        ? "Order → Delivered"
        : "Order → Cancelled"
    );

  }catch(err){

    console.error(err);

    showToast(
      "Could not update order"
    );

  }

};


/* FOOD ITEMS */

function renderFood(){

  const box =
    document.getElementById("foodItems");

  box.innerHTML =
    defaultMenu.map(item => {

      const saved =
        menuSettings[item.id] || {};

      const price =
        Number(
          saved.price ??
          item.price
        );

      const available =
        saved.available !== false;


      return `
        <div class="food-row">

          <div class="food-name">
            ${escapeHTML(item.name)}
          </div>

          <input
            id="price_${item.id}"
            class="price-input"
            type="number"
            value="${price}"
            min="0">

          <div class="availability">

            <button
              id="toggle_${item.id}"
              class="mini-toggle ${available ? "on" : ""}"
              onclick="toggleFood('${item.id}')">
            </button>

            <span id="availability_${item.id}">
              ${available ? "Available" : "Out of Stock"}
            </span>

          </div>

          <button
            class="save-food"
            onclick="saveFood('${item.id}')">
            SAVE
          </button>

        </div>
      `;

    }).join("");

}


/* FOOD TOGGLE LOCAL */

window.toggleFood = function(id){

  const current =
    menuSettings[id]?.available !== false;

  if(!menuSettings[id]){
    menuSettings[id] = {};
  }

  menuSettings[id].available =
    !current;


  const btn =
    document.getElementById(
      "toggle_"+id
    );

  const label =
    document.getElementById(
      "availability_"+id
    );


  if(menuSettings[id].available){

    btn.classList.add("on");

    label.textContent =
      "Available";

  }else{

    btn.classList.remove("on");

    label.textContent =
      "Out of Stock";

  }

};


/* SAVE FOOD */

window.saveFood = async function(id){

  const priceInput =
    document.getElementById(
      "price_"+id
    );

  const price =
    Number(priceInput.value);


  if(price < 0 || Number.isNaN(price)){

    showToast(
      "Enter valid price"
    );

    return;
  }


  if(!menuSettings[id]){
    menuSettings[id] = {};
  }


  const available =
    menuSettings[id].available !== false;


  await update(
    ref(db,"settings/menu/"+id),
    {
      price:price,
      available:available
    }
  );


  showToast(
    "Food item saved"
  );

};


/* WHATSAPP */

window.saveWhatsApp = async function(){

  const number =
    document.getElementById(
      "whatsappNumber"
    ).value
      .replace(/\D/g,"");


  if(number.length < 10){

    showToast(
      "Enter valid WhatsApp number"
    );

    return;
  }


  await set(
    ref(db,"settings/whatsappNumber"),
    number
  );


  showToast(
    "WhatsApp number saved"
  );

};


/* SALES */

function renderSales(){

  const orders =
    getOrderArray();

  const delivered =
    orders.filter(
      o =>
        normalizeStatus(o) === "delivered"
    );


  const folders = {};


  delivered.forEach(order => {

    const date =
      order.createdAt
        ? new Date(
            order.createdAt
          ).toLocaleDateString(
            "en-IN",
            {
              day:"2-digit",
              month:"long",
              year:"numeric"
            }
          )
        : "Unknown Date";


    if(!folders[date]){

      folders[date] = {
        orders:0,
        sales:0,
        delivered:0,
        cancelled:0
      };

    }


    folders[date].orders++;

    folders[date].delivered++;

    folders[date].sales +=
      Number(
        order.total ||
        order.grandTotal ||
        order.amount ||
        0
      );

  });


  orders
    .filter(
      o =>
        normalizeStatus(o) === "cancelled"
    )
    .forEach(order => {

      const date =
        order.createdAt
          ? new Date(
              order.createdAt
            ).toLocaleDateString(
              "en-IN",
              {
                day:"2-digit",
                month:"long",
                year:"numeric"
              }
            )
          : "Unknown Date";


      if(!folders[date]){

        folders[date] = {
          orders:0,
          sales:0,
          delivered:0,
          cancelled:0
        };

      }


      folders[date].cancelled++;

    });


  const dates =
    Object.keys(folders);


  dates.sort(
    (a,b) =>
      new Date(b) -
      new Date(a)
  );


  const box =
    document.getElementById(
      "salesHistory"
    );


  if(!dates.length){

    box.innerHTML =
      `<div class="empty">
        No sales history yet
      </div>`;

    return;
  }


  box.innerHTML =
    dates.map(date => {

      const d =
        folders[date];


      return `
        <div class="sales-folder">

          <div class="sales-folder-head">

            <div>

              <div class="sales-date">
                📁 ${escapeHTML(date)}
              </div>

              <div class="sales-info">
                Orders: ${d.orders}
                &nbsp; • &nbsp;
                Delivered: ${d.delivered}
                &nbsp; • &nbsp;
                Cancelled: ${d.cancelled}
              </div>

            </div>

            <div class="sales-total">
              ₹${d.sales}
            </div>

          </div>

        </div>
      `;

    }).join("");


}


/* DASHBOARD */

function updateDashboard(){

  const orders =
    getOrderArray();


  const received =
    orders.filter(
      o =>
        normalizeStatus(o) === "received"
    ).length;


  const processing =
    orders.filter(
      o =>
        normalizeStatus(o) === "processing"
    ).length;


  const delivery =
    orders.filter(
      o =>
        normalizeStatus(o) === "out_for_delivery"
    ).length;


  const sales =
    orders
      .filter(
        o =>
          normalizeStatus(o) === "delivered"
      )
      .reduce(
        (sum,o) =>
          sum +
          Number(
            o.total ||
            o.grandTotal ||
            o.amount ||
            0
          ),
        0
      );


  document.getElementById("newCount")
    .textContent =
    received;


  document.getElementById("processingCount")
    .textContent =
    processing;


  document.getElementById("deliveryCount")
    .textContent =
    delivery;


  document.getElementById("salesTotal")
    .textContent =
    "₹"+sales;

}


/* TRACK ADMIN */

window.trackAdminOrder = async function(){

  const id =
    document.getElementById(
      "adminTrackId"
    ).value.trim();


  if(!id){

    showToast(
      "Enter Order ID"
    );

    return;
  }


  const snapshot =
    await get(
      ref(db,"orders/"+id)
    );


  const box =
    document.getElementById(
      "adminTrackResult"
    );


  if(!snapshot.exists()){

    box.innerHTML =
      `<div class="empty">
        Order not found
      </div>`;

    return;
  }


  const order =
    snapshot.val();


  const status =
    normalizeStatus(order);


  box.innerHTML =
    `
      <div style="
        margin-top:12px;
        background:#0b0b0b;
        border:1px solid rgba(255,255,255,.06);
        border-radius:10px;
        padding:12px;
        font-size:11px;
      ">

        <strong>
          #${escapeHTML(id)}
        </strong>

        <br><br>

        Current Status:
        <strong style="color:var(--orange)">
          ${status.replaceAll("_"," ").toUpperCase()}
        </strong>

      </div>
    `;

};


/* TRACK FROM CARD */

window.trackOrderFromCard = function(id){

  document.getElementById(
    "adminTrackId"
  ).value = id;

  document.getElementById(
    "adminTrackId"
  ).scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

  setTimeout(
    () => trackAdminOrder(),
    300
  );

};


/* ESCAPE */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* TOAST */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add("show");

  setTimeout(
    () =>
      toast.classList.remove("show"),
    2200
  );

}
