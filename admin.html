<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070707">

<title>The Queen Fast Food - Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --orange:#ff7a00;
  --orange2:#ff941f;
  --black:#070707;
  --card:#101010;
  --card2:#151515;
  --border:rgba(255,122,0,.20);
  --muted:#999;
  --green:#25d366;
  --red:#ff4d4d;
  --blue:#4d9cff;
}

body{
  background:#070707;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= LOGIN ================= */

.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#070707;
}

.login-box{
  width:min(390px,94vw);
  background:#101010;
  border:1px solid var(--border);
  border-radius:20px;
  padding:25px;
  box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.login-title{
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  font-size:38px;
  font-weight:700;
  letter-spacing:2px;
}

.login-title span{
  color:var(--orange);
}

.login-sub{
  text-align:center;
  color:#777;
  font-size:10px;
  letter-spacing:1px;
  margin:3px 0 22px;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  color:#888;
  font-size:10px;
  margin-bottom:6px;
}

.field input{
  width:100%;
  height:43px;
  background:#080808;
  border:1px solid rgba(255,255,255,.10);
  color:#fff;
  border-radius:9px;
  outline:none;
  padding:0 12px;
}

.field input:focus{
  border-color:var(--orange);
}

.login-btn{
  width:100%;
  height:43px;
  border:0;
  border-radius:9px;
  background:var(--orange);
  color:#000;
  font-weight:800;
}

.login-btn:hover{
  background:var(--orange2);
}

.login-error{
  min-height:18px;
  margin-top:9px;
  text-align:center;
  color:#ff6262;
  font-size:11px;
}

/* ================= HEADER ================= */

.header{
  height:68px;
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  background:rgba(7,7,7,.96);
  border-bottom:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(12px);
}

.brand{
  font-family:"Cormorant Garamond",serif;
  font-size:27px;
  font-weight:700;
  letter-spacing:2px;
}

.brand span{
  color:var(--orange);
}

.admin-badge{
  padding:7px 10px;
  border-radius:20px;
  border:1px solid rgba(255,122,0,.25);
  color:#aaa;
  font-size:9px;
  letter-spacing:.5px;
}

/* ================= CONTAINER ================= */

.container{
  width:min(1050px,94%);
  margin:20px auto 40px;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.page-title{
  font-family:"Cormorant Garamond",serif;
  font-size:34px;
  font-weight:700;
}

.page-title span{
  color:var(--orange);
}

.logout-btn{
  background:#151515;
  border:1px solid rgba(255,255,255,.10);
  color:#ddd;
  border-radius:8px;
  padding:9px 13px;
  font-size:10px;
}

/* ================= SHOP ================= */

.shop-control{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#101010;
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px 14px;
  margin-bottom:12px;
}

.shop-left{
  display:flex;
  align-items:center;
  gap:9px;
}

.shop-dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.shop-dot.open{
  background:var(--green);
  box-shadow:0 0 12px rgba(37,211,102,.65);
}

.shop-dot.closed{
  background:var(--red);
  box-shadow:0 0 12px rgba(255,77,77,.55);
}

.shop-name{
  font-size:12px;
  font-weight:800;
}

.shop-state{
  color:#777;
  font-size:9px;
  margin-top:2px;
}

.toggle{
  width:55px;
  height:29px;
  border-radius:20px;
  background:#292929;
  border:1px solid #444;
  position:relative;
}

.toggle:after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#777;
  transition:.2s;
}

.toggle.on{
  background:rgba(37,211,102,.15);
  border-color:var(--green);
}

.toggle.on:after{
  left:29px;
  background:var(--green);
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-bottom:13px;
}

.stat{
  background:#101010;
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  padding:12px;
}

.stat-label{
  color:#777;
  font-size:9px;
  text-transform:uppercase;
}

.stat-value{
  font-size:22px;
  font-weight:800;
  margin-top:4px;
}

.orange{
  color:var(--orange);
}

/* ================= SECTION ================= */

.section{
  background:#101010;
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;
  margin-bottom:13px;
  overflow:hidden;
}

.section-head{
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.section-title{
  font-family:"Cormorant Garamond",serif;
  font-size:23px;
  font-weight:700;
}

.section-title span{
  color:var(--orange);
}

.count{
  min-width:23px;
  height:21px;
  padding:0 7px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,122,0,.12);
  color:var(--orange);
  font-size:9px;
  font-weight:800;
}

.section-body{
  padding:9px;
}

/* ================= ORDERS ================= */

.order-card{
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.06);
  border-radius:10px;
  padding:11px;
  margin-bottom:7px;
}

.order-card:last-child{
  margin-bottom:0;
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

.order-id{
  font-size:12px;
  font-weight:800;
}

.order-date{
  color:#666;
  font-size:8px;
  margin-top:3px;
}

.status-pill{
  padding:5px 8px;
  border-radius:20px;
  font-size:8px;
  font-weight:800;
}

.status-received{
  color:#ff9b3d;
  background:rgba(255,122,0,.13);
}

.status-processing{
  color:#ffcb55;
  background:rgba(255,203,85,.12);
}

.status-delivery{
  color:#69aaff;
  background:rgba(77,156,255,.12);
}

.status-delivered{
  color:#50e58a;
  background:rgba(37,211,102,.12);
}

.status-cancelled{
  color:#ff6b6b;
  background:rgba(255,77,77,.12);
}

.customer-info{
  color:#aaa;
  font-size:10px;
  line-height:1.55;
  margin-top:8px;
}

.customer-info strong{
  color:#fff;
}

.order-items{
  margin-top:7px;
  padding-top:7px;
  border-top:1px solid rgba(255,255,255,.05);
}

.order-item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:#aaa;
  font-size:9px;
  padding:2px 0;
}

.order-total{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  padding-top:7px;
  border-top:1px solid rgba(255,255,255,.05);
  font-size:12px;
  font-weight:800;
}

.order-total span:last-child{
  color:var(--orange);
}

.order-actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:9px;
}

.action-btn{
  border:1px solid rgba(255,255,255,.10);
  background:#171717;
  color:#ddd;
  border-radius:6px;
  padding:7px 9px;
  font-size:8px;
  font-weight:800;
}

.action-btn.orange{
  background:var(--orange);
  border-color:var(--orange);
  color:#000;
}

.action-btn.blue{
  background:rgba(77,156,255,.12);
  border-color:rgba(77,156,255,.25);
  color:#69aaff;
}

.action-btn.green{
  background:rgba(37,211,102,.12);
  border-color:rgba(37,211,102,.25);
  color:#50e58a;
}

.action-btn.red{
  background:rgba(255,77,77,.10);
  border-color:rgba(255,77,77,.20);
  color:#ff6b6b;
}

.empty{
  text-align:center;
  color:#666;
  font-size:10px;
  padding:22px 10px;
}

/* ================= FOOD ================= */

.food-row{
  display:grid;
  grid-template-columns:minmax(150px,1fr) 85px 110px auto;
  align-items:center;
  gap:8px;
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.05);
  border-radius:8px;
  padding:7px;
  margin-bottom:5px;
}

.food-row:last-child{
  margin-bottom:0;
}

.food-name{
  font-size:10px;
  font-weight:700;
}

.price-input{
  width:100%;
  height:31px;
  background:#080808;
  border:1px solid rgba(255,255,255,.10);
  border-radius:7px;
  color:#fff;
  outline:none;
  padding:0 8px;
  font-size:10px;
}

.availability{
  display:flex;
  align-items:center;
  gap:6px;
  color:#888;
  font-size:8px;
}

.mini-toggle{
  width:40px;
  height:22px;
  border-radius:20px;
  background:#292929;
  border:1px solid #444;
  position:relative;
}

.mini-toggle:after{
  content:"";
  position:absolute;
  width:16px;
  height:16px;
  top:2px;
  left:2px;
  background:#777;
  border-radius:50%;
  transition:.18s;
}

.mini-toggle.on{
  background:rgba(37,211,102,.15);
  border-color:var(--green);
}

.mini-toggle.on:after{
  left:20px;
  background:var(--green);
}

.save-food{
  height:31px;
  padding:0 10px;
  border:0;
  border-radius:6px;
  background:var(--orange);
  color:#000;
  font-size:8px;
  font-weight:800;
}

/* ================= SETTINGS ================= */

.settings-box{
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.06);
  border-radius:9px;
  padding:10px;
}

.settings-label{
  color:#777;
  font-size:9px;
  margin-bottom:6px;
}

.settings-input{
  width:100%;
  height:39px;
  background:#080808;
  border:1px solid rgba(255,255,255,.10);
  border-radius:8px;
  color:#fff;
  outline:none;
  padding:0 10px;
  font-size:10px;
}

.save-settings{
  width:100%;
  height:38px;
  margin-top:8px;
  border:0;
  border-radius:8px;
  background:var(--orange);
  color:#000;
  font-weight:800;
  font-size:9px;
}

/* ================= SALES ================= */

.sales-folder{
  background:#0b0b0b;
  border:1px solid rgba(255,255,255,.06);
  border-radius:9px;
  margin-bottom:6px;
  padding:10px;
}

.sales-folder-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sales-date{
  font-size:10px;
  font-weight:800;
}

.sales-info{
  color:#777;
  font-size:8px;
  margin-top:3px;
}

.sales-total{
  color:var(--orange);
  font-size:13px;
  font-weight:800;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:9999;
  background:#171717;
  border:1px solid var(--orange);
  color:#fff;
  padding:10px 13px;
  border-radius:9px;
  font-size:10px;
  opacity:0;
  transform:translateY(60px);
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:750px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .food-row{
    grid-template-columns:1fr 80px;
  }

  .availability{
    grid-column:1;
  }

  .save-food{
    grid-column:2;
    grid-row:2;
  }

}

@media(max-width:500px){

  .header{
    padding:0 13px;
  }

  .brand{
    font-size:20px;
  }

  .admin-badge{
    display:none;
  }

  .container{
    width:94%;
    margin-top:13px;
  }

  .page-title{
    font-size:28px;
  }

}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

    <div class="login-title">
      THE <span>QUEEN</span>
    </div>

    <div class="login-sub">
      FAST FOOD ADMIN PANEL
    </div>

    <div class="field">

      <label>ADMIN EMAIL</label>

    </button>

    </div>

    <div class="stat">

      <div class="stat-label">

      </div>

      <div
        id="salesTotal"

      </div>

    </div>

  </div>


  <!-- NEW ORDERS -->

  <section class="section">

    <div class="section-head">

      <div class="section-title">

      <div
        id="newBadge"

      </div>

    </div>

    <div
      id="newOrders"

    </div>

  </section>


  <!-- PENDING -->

  <section class="section">

    <div class="section-head">

      <div class="section-title">
        Pending <span>Orders</span>
      </div>

      <div
        id="pendingBadge"

        0
      </div>

    </div>

    <div
      id="pendingOrders"
      class="section-body">
    </div>

  </section>


  <!-- CLOSED -->

  <section class="section">

    <div class="section-head">

      <div class="section-title">
        Closed <span>Orders</span>
      </div>

      <div
        id="closedBadge"

      </div>

    </div>

    <div
      id="closedOrders"

  </section>


  <!-- FOOD ITEMS -->

  <section class="section">

    <div class="section-head">

      <div class="section-title">
        Food <span>Items</span>

    </div>

    <div

    </div>

  </section>


  <!-- SETTINGS -->

  <section class="section">

    <div class="section-head">

      <div class="section-title">
        Admin <span>Settings</span>
      </div>

    </div>

    <div class="section-body">

      <div class="settings-box">

        <div class="settings-label">
          WHATSAPP ORDER NUMBER
        </div>

        <input
          id="whatsappNumber"
          class="settings-input"
          placeholder="9090220791">

        <button
          class="save-settings"
          onclick="saveWhatsApp()">

          SAVE WHATSAPP NUMBER

        </button>

      </div>

    </div>

  </section>


  <!-- SALES -->

  <section class="section">

    <div class="section-head">

      <div class="section-title">
        Online <span>Sales</span>
      </div>

    </div>

    <div
      id="salesHistory"
      class="section-body">
    </div>

  </section>


  <!-- TRACK -->

  <section class="section">

      <div class="section-title">

      <div id="adminTrackResult"></div>

    </div>

  </section>

</main>

</div>


<div
  id="toast"
  class="toast">
</div>

/* ================= LOGIN ================= */

window.loginAdmin =
async function(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const error =
    document
      .getElementById("loginError");


  error.textContent = "";


  if(!email || !password){

    error.textContent =
      "Enter email and password.";

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    /*
      onAuthStateChanged()
      automatically opens dashboard.
    */

  }catch(err){

    console.error(
      "Login error:",
      err
    );


    if(err.code ===
       "auth/invalid-credential"){

      error.textContent =
        "Invalid email or password.";

    }else if(
      err.code ===
      "auth/invalid-email"
    ){

      error.textContent =
        "Invalid email.";

    }else if(
      err.code ===
      "auth/too-many-requests"
    ){

      error.textContent =
        "Too many attempts. Try later.";

    }else{

      error.textContent =
        err.message ||
        "Login failed.";

    }

  }

};

/* ================= STATUS ================= */

function normalizeStatus(order){

  let status =
    String(
      order.status ||
      "received"
    ).toLowerCase();


  if(
    status === "new" ||
    status === "placed" ||
    status === "pending" ||
    status === "received"
  ){

    return "received";

  }


  if(
    status === "processing" ||
    status === "confirmed" ||
    status === "preparing" ||
    status === "ready"
  ){

    return "processing";

  }


  if(
    status === "out_for_delivery" ||
    status === "out-for-delivery" ||
    status === "delivery"
  ){

    return "out_for_delivery";

  }


  if(
    status === "delivered" ||
    status === "completed" ||
    status === "closed"
  ){

    return "delivered";

  }


  if(
    status === "cancelled" ||
    status === "canceled"
  ){

    return "cancelled";

  }


  return "received";

}


/* ================= ORDER ARRAY ================= */

function getOrderArray(){

  return Object
    .entries(allOrders)
    .map(
      ([id,order]) => ({
        id,
        ...(order || {})
      })
    )
    .sort(
      (a,b) =>
        Number(b.createdAt || 0) -
        Number(a.createdAt || 0)
    );

}


/* ================= RENDER ORDERS ================= */

function renderOrders(){

  const orders =
    getOrderArray();


  const newOrders =
    orders.filter(
      order =>
        normalizeStatus(order) ===
        "received"
    );


  const pendingOrders =
    orders.filter(
      order => {

        const status =
          normalizeStatus(order);

        return (
          status === "processing" ||
          status === "out_for_delivery"
        );

      }
    );


  const closedOrders =
    orders.filter(
      order => {

        const status =
          normalizeStatus(order);

        return (
          status === "delivered" ||
          status === "cancelled"
        );

      }
    );


  renderOrderBox(
    "newOrders",
    newOrders
  );

  renderOrderBox(
    "pendingOrders",
    pendingOrders
  );

  renderOrderBox(
    "closedOrders",
    closedOrders
  );


  document
    .getElementById("newBadge")
    .textContent =
    newOrders.length;


  document
    .getElementById("pendingBadge")
    .textContent =
    pendingOrders.length;


  document
    .getElementById("closedBadge")
    .textContent =
    closedOrders.length;

}


/* ================= ORDER BOX ================= */

function renderOrderBox(
  elementId,
  orders
){

  const box =
    document.getElementById(
      elementId
    );


  if(!orders.length){

    box.innerHTML =
      `<div class="empty">
        No orders here
      </div>`;

    return;

  }


  box.innerHTML =
    orders
      .map(
        renderOrderCard
      )
      .join("");

}


/* ================= ORDER CARD ================= */

function renderOrderCard(order){

  const status =
    normalizeStatus(order);


  let statusText =
    "ORDER RECEIVED";

  let statusClass =
    "status-received";


  if(status === "processing"){

    statusText =
      "PROCESSING";

    statusClass =
      "status-processing";

  }


  if(status === "out_for_delivery"){

    statusText =
      "OUT FOR DELIVERY";

    statusClass =
      "status-delivery";

  }


  if(status === "delivered"){

    statusText =
      "DELIVERED";

    statusClass =
      "status-delivered";

  }


  if(status === "cancelled"){

    statusText =
      "CANCELLED";

    statusClass =
      "status-cancelled";

  }


  const date =
    order.createdAt
      ? new Date(
          order.createdAt
        ).toLocaleString("en-IN")
      : "-";


  const customer =
    order.customerName ||
    order.name ||
    "Customer";


  const phone =
    order.phone ||
    order.mobile ||
    "";


  const address =
    order.address ||
    order.deliveryAddress ||
    "Address not available";


  const items =
    Array.isArray(order.items)
      ? order.items
      : Object.values(
          order.items || {}
        );


  const itemHTML =
    items.map(item => {

      const name =
        item.name ||
        "Food Item";


      const qty =
        Number(
          item.quantity ||
          item.qty ||
          1
        );


      const price =
        Number(
          item.price ||
          0
        );


      return `

        <div class="order-item">

          <span>
            ${escapeHTML(name)}
            × ${qty}
          </span>

          <span>
            ₹${price * qty}
          </span>

        </div>

      `;

    }).join("");


  const total =
    Number(
      order.total ||
      order.grandTotal ||
      order.amount ||
      0
    );


  return `

    <div class="order-card">

      <div class="order-top">

        <div>

          <div class="order-id">
            #${escapeHTML(order.id)}
          </div>

          <div class="order-date">
            ${escapeHTML(date)}
          </div>

        </div>

        <div
          class="status-pill ${statusClass}">

          ${statusText}

        </div>

      </div>


      <div class="customer-info">

        <strong>
          ${escapeHTML(customer)}
        </strong>

        ${
          phone
            ? `<br>📞 ${escapeHTML(phone)}`
            : ""
        }

        <br>
        📍 ${escapeHTML(address)}

      </div>


      <div class="order-items">

        ${
          itemHTML ||
          `<div class="order-item">
             <span>Order items</span>
             <span>-</span>
           </div>`
        }

      </div>


      <div class="order-total">

        <span>
          TOTAL
        </span>

        <span>
          ₹${total}
        </span>

      </div>


      ${renderActionButtons(
        order.id,
        status
      )}

    </div>

  `;

}


/* ================= ACTION BUTTONS ================= */

function renderActionButtons(
  orderId,
  status
){

  let html =
    `<div class="order-actions">`;


  if(status === "received"){

    html += `

      <button
        class="action-btn orange"
        onclick="changeStatus(
          '${orderId}',
          'processing'
        )">

        PROCESSING

      </button>

      <button
        class="action-btn red"
        onclick="changeStatus(
          '${orderId}',
          'cancelled'
        )">

        CANCEL

      </button>

    `;

  }


  if(status === "processing"){

    html += `

      <button
        class="action-btn blue"
        onclick="changeStatus(
          '${orderId}',
          'out_for_delivery'
        )">

        OUT FOR DELIVERY

      </button>

      <button
        class="action-btn red"
        onclick="changeStatus(
          '${orderId}',
          'cancelled'
        )">

        CANCEL

      </button>

    `;

  }


  if(status === "out_for_delivery"){

    html += `

      <button
        class="action-btn green"
        onclick="changeStatus(
          '${orderId}',
          'delivered'
        )">

        DELIVERED

      </button>

    `;

  }


  html += `

    <button
      class="action-btn"
      onclick="trackOrderFromCard(
        '${orderId}'
      )">

      TRACK

    </button>

  `;


  html += `</div>`;


  return html;

}


/* ================= CHANGE STATUS ================= */

window.changeStatus =
async function(
  orderId,
  newStatus
){

  try{

    await update(
      ref(
        db,
        "orders/"+orderId
      ),
      {
        status:newStatus,
        updatedAt:Date.now()
      }
    );


    let message =
      "Order updated";


    if(newStatus === "processing"){

      message =
        "ORDER → PROCESSING";

    }


    if(newStatus === "out_for_delivery"){

      message =
        "ORDER → OUT FOR DELIVERY";

    }


    if(newStatus === "delivered"){

      message =
        "ORDER → DELIVERED";

    }


    if(newStatus === "cancelled"){

      message =
        "ORDER → CANCELLED";

    }


    showToast(message);

  }catch(error){

    console.error(error);

    showToast(
      "Order update failed"
    );

  }

};

  box.innerHTML =

/* ================= FOOD TOGGLE ================= */

window.toggleFood =
function(id){

  if(!menuSettings[id]){

    menuSettings[id] = {};

  }


  const current =
    menuSettings[id].available !== false;


  menuSettings[id].available =
    !current;


  const button =
    document.getElementById(
      "toggle_"+id
    );


  const label =
    document.getElementById(
      "availability_"+id
    );


  if(
    menuSettings[id].available
  ){

    button.classList.add("on");

    label.textContent =
      "Available";

  }else{

    button.classList.remove("on");

    label.textContent =
      "Out of Stock";

  }

};


/* ================= SAVE FOOD ================= */

window.saveFood =
async function(id){

  const price =
    Number(
      document.getElementById(
        "price_"+id
      ).value
    );


  if(
    Number.isNaN(price) ||
    price < 0
  ){

    showToast(
      "Invalid price"
    );

    return;

  }


  if(!menuSettings[id]){

    menuSettings[id] = {};

  }


  const available =
    menuSettings[id].available !== false;


  try{

    await update(
      ref(
        db,
        "settings/menu/"+id
      ),
      {
        price:price,
        available:available
      }
    );


    showToast(
      "Food item saved"
    );

  }catch(error){

    console.error(error);

    showToast(
      "Food save failed"
    );

  }

};

/* ================= SALES ================= */

function renderSales(){

  const orders =
    getOrderArray();


  const folders = {};


  orders.forEach(order => {

    const status =
      normalizeStatus(order);


    const date =
      order.createdAt
        ? new Date(
            order.createdAt
          ).toLocaleDateString(
            "en-IN",
            {
              day:"2-digit",
              month:"long",
              year:"numeric"
            }
          )
        : "Unknown Date";


    if(!folders[date]){

      folders[date] = {

        orders:0,

        sales:0,

        delivered:0,

        cancelled:0

      };

    }


    folders[date].orders++;


    if(status === "delivered"){

      folders[date].delivered++;

      folders[date].sales +=
        Number(
          order.total ||
          order.grandTotal ||
          order.amount ||
          0
        );

    }


    if(status === "cancelled"){

      folders[date].cancelled++;

    }

  });


  const dates =
    Object.keys(folders);


  dates.sort(
    (a,b) =>
      new Date(b) -
      new Date(a)
  );


  const box =
    document.getElementById(
      "salesHistory"
    );


  if(!dates.length){

    box.innerHTML =
      `<div class="empty">
        No sales history yet
      </div>`;

    return;

  }


  box.innerHTML =
    dates.map(date => {

      const d =
        folders[date];


      return `

        <div class="sales-folder">

          <div class="sales-folder-head">

            <div>

              <div class="sales-date">
                📁 ${escapeHTML(date)}
              </div>

              <div class="sales-info">

                Orders: ${d.orders}

                &nbsp; • &nbsp;

                Delivered: ${d.delivered}

                &nbsp; • &nbsp;

                Cancelled: ${d.cancelled}

              </div>

            </div>

            <div class="sales-total">
              ₹${d.sales}
            </div>

          </div>

        </div>

      `;

    }).join("");

}


/* ================= DASHBOARD ================= */

function updateDashboard(){

  const orders =
    getOrderArray();


  const received =
    orders.filter(
      order =>
        normalizeStatus(order) ===
        "received"
    ).length;


  const processing =
    orders.filter(
      order =>
        normalizeStatus(order) ===
        "processing"
    ).length;


  const delivery =
    orders.filter(
      order =>
        normalizeStatus(order) ===
        "out_for_delivery"
    ).length;


  const sales =
    orders
      .filter(
        order =>
          normalizeStatus(order) ===
          "delivered"
      )
      .reduce(
        (sum,order) =>
          sum +
          Number(
            order.total ||
            order.grandTotal ||
            order.amount ||
            0
          ),
        0
      );


  document
    .getElementById("newCount")
    .textContent =
    received;


  document
    .getElementById("processingCount")
    .textContent =
    processing;


  document
    .getElementById("deliveryCount")
    .textContent =
    delivery;


  document
    .getElementById("salesTotal")
    .textContent =
    "₹"+sales;

}


/* ================= ADMIN TRACK ================= */

window.trackAdminOrder =
async function(){

  const id =
    document
      .getElementById(
        "adminTrackId"
      )
      .value
      .trim();


  if(!id){

    showToast(
      "Enter Order ID"
    );

    return;

  }


  try{

    const snapshot =
      await get(
        ref(
          db,
          "orders/"+id
        )
      );


    const box =
      document.getElementById(
        "adminTrackResult"
      );


    if(!snapshot.exists()){

      box.innerHTML =
        `<div class="empty">
          Order not found
        </div>`;

      return;

    }


    const order =
      snapshot.val();


    const status =
      normalizeStatus(order);


    box.innerHTML = `

      <div
        style="
          margin-top:10px;
          background:#0b0b0b;
          border:1px solid rgba(255,255,255,.06);
          border-radius:9px;
          padding:11px;
          font-size:10px;
        ">

        <strong>
          #${escapeHTML(id)}
        </strong>

        <br><br>

        CURRENT STATUS:

        <strong
          style="color:var(--orange)">

          ${status
            .replaceAll("_"," ")
            .toUpperCase()}

        </strong>

      </div>

    `;

  }catch(error){

    console.error(error);

    showToast(
      "Track failed"
    );

  }

};


/* ================= TRACK FROM CARD ================= */

window.trackOrderFromCard =
function(id){

  document
    .getElementById(
      "adminTrackId"
    )
    .value =
    id;


  document
    .getElementById(
      "adminTrackId"
    )
    .scrollIntoView({
      behavior:"smooth",
      block:"center"
    });


  setTimeout(
    () =>
      trackAdminOrder(),
    300
  );

};


/* ================= ESCAPE ================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* ================= TOAST ================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(
    () => {

      toast.classList.remove(
        "show"
      );

    },
    2200
  );

}
