<script>

function renderMenu(menu){

  const list =
    $("menuList");

  const merged = {};

  /*
    IMPORTANT:
    Admin menu will show ONLY the items
    defined inside defaultMenu.
    Extra Firebase keys will NOT appear.
  */

  Object.keys(defaultMenu)
    .forEach(
      id=>{

        merged[id] = {

          ...defaultMenu[id],

          ...(menu?.[id] || {})

        };

      }
    );


  list.innerHTML =
    Object.entries(merged)
      .map(
        ([id,item])=>`

        <div class="menu-item">

          <div class="menu-top">

            <div>

              <div class="menu-name">
                ${escapeHtml(item.name)}
              </div>

              <div class="menu-id">
                ${escapeHtml(id)}
              </div>

            </div>

            <div class="menu-price-area">

              <input
                id="price-${id}"
                class="menu-price-input"
                type="number"
                min="0"
                value="${Number(item.price ?? 0)}"
              >

              <button
                class="btn btn-gold menu-save"
                onclick="saveMenuPrice('${id}')"
              >
                SAVE
              </button>

            </div>

          </div>


          <div
            style="
              display:flex;
              gap:6px;
              align-items:center;
              margin-top:6px;
            "
          >

            <select
              id="stock-${id}"
              class="stock-select ${item.stock === false ? "out" : "available"}"
              onchange="saveMenuStock('${id}',this.value)"
            >

              <option
                value="available"
                ${item.stock !== false ? "selected" : ""}
              >
                AVAILABLE
              </option>

              <option
                value="out"
                ${item.stock === false ? "selected" : ""}
              >
                OUT OF STOCK
              </option>

            </select>

          </div>


          <div class="image-area">

            <img
              id="preview-${id}"
              class="image-preview"
              src="${escapeHtml(item.image || "")}"
              onerror="this.style.opacity=.25"
            >

            <div class="image-url">

              <input
                id="image-${id}"
                value="${escapeHtml(item.image || "")}"
                placeholder="Food image URL"
              >

            </div>

            <button
              class="btn btn-dark image-save"
              onclick="saveMenuImage('${id}')"
            >
              IMAGE
            </button>

          </div>


          <button
            class="btn btn-red menu-remove"
            onclick="removeMenuItem('${id}')"
          >
            🗑️ REMOVE
          </button>

        </div>

      `
      )
      .join("");

}


/* =========================================================
   MENU PRICE
========================================================= */

window.saveMenuPrice =
async function(id){

  const input =
    $(`price-${id}`);

  const value =
    Number(
      input?.value
    );


  if(
    !Number.isFinite(value) ||
    value < 0
  ){

    showToast(
      "Enter a valid price."
    );

    return;

  }


  try{

    await update(
      ref(
        db,
        `settings/menu/${id}`
      ),
      {
        price:value
      }
    );


    /*
      IMPORTANT:
      Update local admin state immediately.
      This keeps admin UI and Firebase data synchronized.
    */

    if(!settings.menu){
      settings.menu = {};
    }


    settings.menu[id] = {

      ...(settings.menu[id] || defaultMenu[id] || {}),

      price:value

    };


    /*
      Re-render only the menu.
      Orders/settings remain untouched.
    */

    renderMenu(
      settings.menu
    );


    showToast(
      "Food price updated."
    );


  }catch(error){

    console.error(
      "MENU PRICE UPDATE ERROR:",
      error
    );

    showToast(
      error.message ||
      "Price update failed."
    );

  }

};


/* =========================================================
   MENU STOCK
========================================================= */

window.saveMenuStock =
async function(id,value){

  const stock =
    value === "available";


  try{

    await update(
      ref(
        db,
        `settings/menu/${id}`
      ),
      {
        stock:stock
      }
    );


    /*
      IMPORTANT:
      Keep local admin state synchronized immediately.
    */

    if(!settings.menu){
      settings.menu = {};
    }


    settings.menu[id] = {

      ...(settings.menu[id] || defaultMenu[id] || {}),

      stock:stock

    };


    /*
      Re-render menu so the saved state
      remains visible immediately.
    */

    renderMenu(
      settings.menu
    );


    showToast(
      stock
        ? "Item available."
        : "Item marked out of stock."
    );


  }catch(error){

    console.error(
      "MENU STOCK UPDATE ERROR:",
      error
    );

    showToast(
      error.message ||
      "Stock update failed."
    );

  }

};


/* =========================================================
   MENU IMAGE
========================================================= */

window.saveMenuImage =
async function(id){

  const input =
    $(`image-${id}`);


  const image =
    input
      ? input.value.trim()
      : "";


  if(
    image &&
    !/^https?:\/\//i.test(image)
  ){

    showToast(
      "Image URL must start with http:// or https://"
    );

    return;

  }


  try{

    await update(
      ref(
        db,
        `settings/menu/${id}`
      ),
      {
        image:image
      }
    );


    /*
      Update local state immediately.
    */

    if(!settings.menu){
      settings.menu = {};
    }


    settings.menu[id] = {

      ...(settings.menu[id] || defaultMenu[id] || {}),

      image:image

    };


    renderMenu(
      settings.menu
    );


    showToast(
      "Food image updated."
    );


  }catch(error){

    console.error(
      "MENU IMAGE UPDATE ERROR:",
      error
    );

    showToast(
      error.message ||
      "Image update failed."
    );

  }

};


/* =========================================================
   MENU REMOVE / HIDE
========================================================= */

window.removeMenuItem =
async function(id){

  const menuItem =
    settings.menu?.[id] ||
    defaultMenu[id] ||
    {};


  const itemName =
    menuItem.name ||
    id;


  const confirmed =
    confirm(
      `Remove "${itemName}" from customer menu?\n\nThe item will NOT be deleted. It will only be hidden from the customer website.`
    );


  if(!confirmed){
    return;
  }


  try{

    await update(
      ref(
        db,
        `settings/menu/${id}`
      ),
      {
        removed:true
      }
    );


    if(!settings.menu){
      settings.menu = {};
    }


    settings.menu[id] = {

      ...(settings.menu[id] || defaultMenu[id] || {}),

      removed:true

    };


    /*
      Keep the item in ADMIN because it is a fixed menu item.
      Customer website can hide it using removed:true.
    */

    renderMenu(
      settings.menu
    );


    showToast(
      `${itemName} removed from customer menu.`
    );


  }catch(error){

    console.error(
      "MENU REMOVE ERROR:",
      error
    );

    showToast(
      error.message ||
      "Could not remove menu item."
    );

  }

};


/* =========================================================
   ORDER STATUS
========================================================= */

function normalizeStatus(value){

  const v =
    String(value || "")
      .trim()
      .toLowerCase();


  if(
    !v ||
    v === "new" ||
    v === "received"
  ){
    return "received";
  }


  if(
    v === "confirmed" ||
    v === "processing" ||
    v === "processed"
  ){
    return "processing";
  }


  if(
    v === "preparing" ||
    v === "making" ||
    v === "preparing food"
  ){
    return "making";
  }


  if(
    v === "out for delivery" ||
    v === "out_for_delivery" ||
    v === "outfordelivery"
  ){
    return "out_for_delivery";
  }


  if(
    v === "delivered" ||
    v === "complete" ||
    v === "completed" ||
    v === "customer received" ||
    v === "customer_received" ||
    v === "delivery confirmed" ||
    v === "delivery_confirmed"
  ){
    return "delivered";
  }


  if(
    v === "cancelled" ||
    v === "canceled" ||
    v === "cancel"
  ){
    return "cancelled";
  }


  return "received";

}


function getOrderStatus(order){

  if(!order){
    return "received";
  }


  return normalizeStatus(
    order.status ||
    order.orderStatus ||
    order.deliveryStatus ||
    order.customerOrderStatus
  );

}


function statusLabel(status){

  const s =
    normalizeStatus(status);


  if(s === "received")
    return "RECEIVED";


  if(s === "processing")
    return "PROCESSING";


  if(s === "making")
    return "MAKING";


  if(s === "out_for_delivery")
    return "OUT FOR DELIVERY";


  if(s === "delivered")
    return "DELIVERED";


  if(s === "cancelled")
    return "CANCELLED";


  return "RECEIVED";

}


/* =========================================================
   NEW ORDER DETECTION
========================================================= */

function detectNewOrders(
  newOrders
){

  const ids =
    Object.keys(newOrders);


  if(!newOrdersInitialized){

    ids.forEach(
      id=>{

        const order =
          newOrders[id];


        if(
          order &&
          getOrderStatus(order) === "received" &&
          order.activeRemoved !== true
        ){

          knownNewOrderIds.add(id);

        }

      }
    );


    newOrdersInitialized =
      true;


    return;

  }


  const newReceived =
    ids.filter(
      id=>{

        const order =
          newOrders[id];


        return (
          order &&
          getOrderStatus(order) === "received" &&
          order.activeRemoved !== true &&
          !knownNewOrderIds.has(id)
        );

      }
    );


  ids.forEach(
    id=>{

      const order =
        newOrders[id];


      if(
        order &&
        getOrderStatus(order) === "received" &&
        order.activeRemoved !== true
      ){

        knownNewOrderIds.add(id);

      }

    }
  );


  if(!newReceived.length){
    return;
  }


  notificationActive =
    true;


  startNotificationEffects(
    newReceived.length
  );

}


function startNotificationEffects(
  count
){

  const button =
    $("notificationButton");


  const folder =
    $("folderNew");


  const dot =
    $("newOrderDot");


  if(button){
    button.classList.add(
      "blink"
    );
  }


  if(folder){
    folder.classList.add(
      "new-summary-alert"
    );
  }


  if(dot){
    dot.classList.add(
      "alert"
    );
  }


  playNewOrderSound();


  showToast(
    `🔔 ${count} NEW ORDER RECEIVED`
  );

}


function stopNotificationEffects(){

  notificationActive =
    false;


  $("notificationButton")
    ?.classList.remove(
      "blink"
    );


  $("folderNew")
    ?.classList.remove(
      "new-summary-alert"
    );


  $("newOrderDot")
    ?.classList.remove(
      "alert"
    );

}


function playNewOrderSound(){

  try{

    if(
      !notificationAudioContext
    ){

      notificationAudioContext =
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(
      notificationAudioContext.state ===
      "suspended"
    ){

      notificationAudioContext.resume();

    }


    const now =
      notificationAudioContext.currentTime;


    [0,.18,.36].forEach(
      (delay,index)=>{

        const oscillator =
          notificationAudioContext
            .createOscillator();


        const gain =
          notificationAudioContext
            .createGain();


        oscillator.type =
          "sine";


        oscillator.frequency.value =
          index === 2
            ? 1100
            : 850;


        gain.gain.setValueAtTime(
          .0001,
          now + delay
        );


        gain.gain
          .exponentialRampToValueAtTime(
            .18,
            now + delay + .02
          );


        gain.gain
          .exponentialRampToValueAtTime(
            .0001,
            now + delay + .13
          );


        oscillator.connect(
          gain
        );


        gain.connect(
          notificationAudioContext.destination
        );


        oscillator.start(
          now + delay
        );


        oscillator.stop(
          now + delay + .14
        );

      }
    );

  }catch(error){

    console.warn(
      "Notification sound unavailable:",
      error
    );

  }

}


/* =========================================================
   FOLDER
========================================================= */

window.selectFolder =
function(folder){

  selectedFolder =
    folder;


  if(folder === "complete"){

    stopNotificationEffects();


    renderCompleteModal();


    openModal(
      "completeModal"
    );


    return;

  }


  if(folder === "cancelled"){

    renderCancelledModal();


    openModal(
      "cancelledModal"
    );


    return;

  }


  if(
    folder === "new" ||
    folder === "pending" ||
    folder === "delivery"
  ){

    stopNotificationEffects();


    $("orderManagement")
      ?.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

  }

};


/* =========================================================
   ORDERS
========================================================= */

function renderOrders(){

  const active = [];
  const complete = [];
  const cancelled = [];


  Object.entries(orders)
    .forEach(
      ([key,order])=>{

        const status =
          getOrderStatus(order);


        if(
          status === "delivered"
        ){

          complete.push([
            key,
            order
          ]);

        }


        else if(
          status === "cancelled"
        ){

          cancelled.push([
            key,
            order
          ]);

        }


        else if(
          order.activeRemoved !== true
        ){

          active.push([
            key,
            order
          ]);

        }

      }
    );


  const sortOrders =
    list=>{

      list.sort(
        (a,b)=>{

          return Number(
            b[1].createdAt || 0
          ) -
          Number(
            a[1].createdAt || 0
          );

        }
      );

    };


  sortOrders(active);
  sortOrders(complete);
  sortOrders(cancelled);


  updateFolderCounts(
    active,
    complete,
    cancelled
  );


  $("activeOrdersList").innerHTML =
    active.length
      ? active
          .map(
            ([key,order])=>
              createOrderCard(
                key,
                order,
                getOrderStatus(order) === "received"
              )
          )
          .join("")
      : `<div class="empty">
          No active customer orders.
         </div>`;


  $("activeOrderCount").textContent =
    active.length;


  renderCompleteModal(
    complete
  );


  renderCancelledModal(
    cancelled
  );


  if(
    notificationActive &&
    active.some(
      ([,order])=>
        getOrderStatus(order) === "received"
    )
  ){

    $("activeOrdersList")
      .classList.add(
        "new-active-alert"
      );

  }else{

    $("activeOrdersList")
      .classList.remove(
        "new-active-alert"
      );

  }

}


function updateFolderCounts(
  active,
  complete,
  cancelled
){

  const values = {

    new:
      active.filter(
        ([,order])=>
          getOrderStatus(order) === "received"
      ).length,


    pending:
      active.filter(
        ([,order])=>{

          const status =
            getOrderStatus(order);


          return (
            status === "processing" ||
            status === "making"
          );

        }
      ).length,


    delivery:
      active.filter(
        ([,order])=>
          getOrderStatus(order) === "out_for_delivery"
      ).length,


    complete:
      complete.length,


    cancelled:
      cancelled.length

  };


  $("newCount").textContent =
    values.new;


  $("pendingCount").textContent =
    values.pending;


  $("deliveryCount").textContent =
    values.delivery;


  $("completeCount").textContent =
    values.complete;


  $("cancelledCount").textContent =
    values.cancelled;


  $("completeModalList").dataset.count =
    values.complete;


  $("cancelledModalList").dataset.count =
    values.cancelled;


  const badge =
    $("notificationBadge");


  if(badge){

    badge.textContent =
      values.new;

  }

}


/* =========================================================
   COMPLETE MODAL
========================================================= */

function renderCompleteModal(
  listOverride = null
){

  let list =
    listOverride;


  if(!list){

    list =
      Object.entries(orders)
        .filter(
          ([,order])=>
            getOrderStatus(order) === "delivered"
        );

  }


  list.sort(
    (a,b)=>
      Number(
        b[1].createdAt || 0
      ) -
      Number(
        a[1].createdAt || 0
      )
  );


  $("completeModalList").innerHTML =
    list.length
      ? list
          .map(
            ([key,order])=>
              createOrderCard(
                key,
                order,
                false
              )
          )
          .join("")
      : `<div class="empty">
          No completed orders.
         </div>`;

}


/* =========================================================
   CANCELLED MODAL
========================================================= */

function renderCancelledModal(
  listOverride = null
){

  let list =
    listOverride;


  if(!list){

    list =
      Object.entries(orders)
        .filter(
          ([,order])=>
            getOrderStatus(order) === "cancelled"
        );

  }


  list.sort(
    (a,b)=>
      Number(
        b[1].createdAt || 0
      ) -
      Number(
        a[1].createdAt || 0
      )
  );


  $("cancelledModalList").innerHTML =
    list.length
      ? list
          .map(
            ([key,order])=>
              createOrderCard(
                key,
                order,
                false
              )
          )
          .join("")
      : `<div class="empty">
          No cancelled orders.
         </div>`;

}


/* =========================================================
   ORDER CARD
========================================================= */

function createOrderCard(
  key,
  order,
  isNew
){

  const status =
    getOrderStatus(order);


  const statusClass =
    status;


  const itemList =
    Array.isArray(order.items)
      ? order.items
      : Object.values(
          order.items || {}
        );


  const itemHtml =
    itemList.length
      ? itemList.map(
          item=>`

          <div class="order-item">

            <span>
              ${escapeHtml(
                item.name ||
                item.itemName ||
                "Item"
              )}
              ×
              ${Number(
                item.quantity ||
                item.qty ||
                1
              )}
            </span>

            <strong>
              ₹${Number(
                item.total ||
                (
                  Number(
                    item.price || 0
                  ) *
                  Number(
                    item.quantity ||
                    item.qty ||
                    1
                  )
                )
              )}
            </strong>

          </div>

        `).join("")
      : `<div class="order-item">
           <span>No item details</span>
         </div>`;


  let actionHtml = "";


  if(status === "received"){

    actionHtml = `

      <div class="status-buttons">

        <button
          class="btn btn-green"
          onclick="updateOrderStatus('${key}','processing')"
        >
          ✓ CONFIRM ORDER
        </button>

        <button
          class="btn btn-red"
          onclick="updateOrderStatus('${key}','cancelled')"
        >
          ✕ CANCEL
        </button>

      </div>

    `;

  }


  else if(status === "processing"){

    actionHtml = `

      <div class="status-buttons">

        <button
          class="btn btn-orange"
          onclick="updateOrderStatus('${key}','making')"
        >
          👨‍🍳 START PREPARING
        </button>

        <button
          class="btn btn-red"
          onclick="updateOrderStatus('${key}','cancelled')"
        >
          ✕ CANCEL
        </button>

      </div>

    `;

  }


  else if(status === "making"){

    actionHtml = `

      <div class="status-buttons">

        <button
          class="btn btn-purple"
          onclick="updateOrderStatus('${key}','out_for_delivery')"
        >
          🏍️ OUT FOR DELIVERY
        </button>

        <button
          class="btn btn-red"
          onclick="updateOrderStatus('${key}','cancelled')"
        >
          ✕ CANCEL
        </button>

      </div>

    `;

  }


  else if(status === "out_for_delivery"){

    actionHtml = `

      <div
        style="
          margin-top:7px;
          padding:7px 8px;
          border-radius:7px;
          background:#211235;
          border:1px solid #6639a0;
          color:#c394ff;
          font-size:8px;
          font-weight:900;
        "
      >
        🏍️ OUT FOR DELIVERY — WAITING FOR CUSTOMER DELIVERY CONFIRMATION
      </div>

    `;

  }


  else if(
    status === "delivered" ||
    status === "cancelled"
  ){

    actionHtml = `

      <div class="status-buttons">

        <button
          class="btn btn-dark"
          onclick="removeOrder('${key}')"
        >
          REMOVE ORDER
        </button>

      </div>

    `;

  }


  if(
    status !== "delivered" &&
    status !== "cancelled" &&
    order.activeRemoved !== true
  ){

    actionHtml += `

      <div class="status-buttons">

        <button
          class="btn btn-dark"
          onclick="removeActiveOrder('${key}')"
        >
          🗑️ REMOVE FROM ACTIVE
        </button>

      </div>

    `;

  }


  const lat =
    order.latitude ??
    order.lat ??
    order.customerLat;


  const lng =
    order.longitude ??
    order.lng ??
    order.customerLng;


  let mapsUrl = "";


  if(
    lat !== undefined &&
    lng !== undefined &&
    lat !== "" &&
    lng !== ""
  ){

    mapsUrl =
      `https://www.google.com/maps?q=${encodeURIComponent(lat)},${encodeURIComponent(lng)}`;

  }else{

    mapsUrl =
      order.mapsLink ||
      order.selectedGoogleMapsLink ||
      order.googleMapsLink ||
      order.customerLocationLink ||
      "";

  }


  let mapsHtml = "";


  if(mapsUrl){

    mapsHtml = `

      <a
        class="maps-btn"
        target="_blank"
        rel="noopener"
        href="${escapeHtml(mapsUrl)}"
      >
        📍 OPEN CUSTOMER LOCATION
      </a>

    `;

  }


  const rawDistance =
    order.distanceKm ??
    order.deliveryDistance ??
    order.distance ??
    order.deliveryKm ??
    null;


  let distanceHtml = "-";


  if(
    rawDistance !== null &&
    rawDistance !== "" &&
    Number.isFinite(Number(rawDistance))
  ){

    distanceHtml =
      `${Number(rawDistance).toFixed(2)} KM`;

  }


  const customerLocation =
    order.selectedLocationText ||
    order.locationText ||
    order.customerLocation ||
    order.location ||
    order.address ||
    order.customerAddress ||
    "-";


  const newClass =
    isNew
      ? "new-order"
      : "";


  const arrivalClass =
    isNew &&
    notificationActive
      ? "new-arrival"
      : "";


  return `

    <div
      class="order ${newClass} ${arrivalClass}"
      data-order-key="${escapeHtml(key)}"
    >

      <div class="order-head">

        <div>

          <div class="order-id">

            #${escapeHtml(
              order.orderId ||
              key
            )}

          </div>

          <div class="order-date">

            ${formatDate(
              order.createdAt
            )}

          </div>

        </div>

        <div
          class="status ${statusClass}"
        >
          ${escapeHtml(
            statusLabel(status)
          )}
        </div>

      </div>


      <div class="order-info">

        <div class="info-box">

          <small>
            Customer
          </small>

          ${escapeHtml(
            order.customerName ||
            order.name ||
            "-"
          )}

        </div>


        <div class="info-box">

          <small>
            Phone
          </small>

          ${escapeHtml(
            order.customerPhone ||
            order.phone ||
            "-"
          )}

        </div>


        <div class="info-box">

          <small>
            Payment
          </small>

          ${escapeHtml(

/* =========================================================
   ORDER STATUS SYNC
========================================================= */

window.updateOrderStatus =
async function(
  key,
  newStatus
){

  try{

    const order =
      orders[key];


    if(!order){

      throw new Error(
        "Order not found."
      );

    }


    if(
      String(newStatus)
        .trim()
        .toLowerCase() ===
      "delivered"
    ){

      showToast(
        "Delivered status can only be confirmed by the customer."
      );

      return;

    }


    const status =
      normalizeStatus(
        newStatus
      );


    const currentStatus =
      getOrderStatus(order);


    const allowedTransitions = {

      received:[
        "processing",
        "cancelled"
      ],

      processing:[
        "making",
        "cancelled"
      ],

      making:[
        "out_for_delivery",
        "cancelled"
      ],

      out_for_delivery:[],

      delivered:[],

      cancelled:[]

    };


    if(
      !allowedTransitions[
        currentStatus
      ]?.includes(status)
    ){

      showToast(
        `Cannot change ${statusLabel(currentStatus)} to ${statusLabel(status)}.`
      );

      return;

    }


    const now =
      Date.now();


    const updates = {};


    updates[
      `orders/${key}/status`
    ] =
      status;


    updates[
      `orders/${key}/orderStatus`
    ] =
      status;


    updates[
      `orders/${key}/updatedAt`
    ] =
      now;


    if(order.ownerUid){

      updates[
        `customerOrders/${order.ownerUid}/${key}/status`
      ] =
        status;


      updates[
        `customerOrders/${order.ownerUid}/${key}/orderStatus`
      ] =
        status;


      updates[
        `customerOrders/${order.ownerUid}/${key}/updatedAt`
      ] =
        now;

    }


    const customerId =
      order.customerId ||
      order.customerUID ||
      order.uid ||
      null;


    if(
      customerId &&
      customerId !== order.ownerUid
    ){

      updates[
        `customerOrders/${customerId}/${key}/status`
      ] =
        status;


      updates[
        `customerOrders/${customerId}/${key}/orderStatus`
      ] =
        status;


      updates[
        `customerOrders/${customerId}/${key}/updatedAt`
      ] =
        now;

    }


    const customerOrderId =
      order.customerOrderId ||
      order.orderId ||
      null;


    if(
      customerOrderId &&
      customerOrderId !== key
    ){

      updates[
        `orders/${customerOrderId}/status`
      ] =
        status;


      updates[
        `orders/${customerOrderId}/orderStatus`
      ] =
        status;


      updates[
        `orders/${customerOrderId}/updatedAt`
      ] =
        now;

    }


    if(status === "cancelled"){

      updates[
        `cancelledOrders/${key}`
      ] = {

        ...order,

        status:
          "cancelled",

        orderStatus:
          "cancelled",

        cancelledAt:
          now,

        updatedAt:
          now

      };


      updates[
        `deliveredOrders/${key}`
      ] =
        null;

    }


    if(
      status !== "cancelled"
    ){

      updates[
        `deliveredOrders/${key}`
      ] =
        null;


      updates[
        `cancelledOrders/${key}`
      ] =
        null;

    }


    await update(
      ref(db),
      updates
    );


    if(orders[key]){

      orders[key] = {

        ...orders[key],

        status:
          status,

        orderStatus:
          status,

        updatedAt:
          now

      };

    }


    renderOrders();
    renderNotificationList();


    showToast(
      `Order ${statusLabel(status)}.`
    );


    if(status !== "received"){

      closeNotifications();

    }

  }catch(error){

    console.error(
      "ORDER STATUS UPDATE ERROR:",
      error
    );


    showToast(
      error.message ||
      "Could not update order."
    );

  }

};


/* =========================================================
   REMOVE ACTIVE ORDER
========================================================= */

window.removeActiveOrder =
async function(key){

  try{

    const order =
      orders[key];


    if(!order){

      showToast(
        "Order not found."
      );

      return;

    }


    const status =
      getOrderStatus(order);


    if(
      status === "delivered" ||
      status === "cancelled"
    ){

      showToast(
        "Use REMOVE ORDER for completed/cancelled orders."
      );

      return;

    }


    const confirmed =
      confirm(
        "Remove this order from Active Orders?\n\nThe order will NOT be deleted from customer history."
      );


    if(!confirmed){
      return;
    }


    const now =
      Date.now();


    const updates = {

      [`orders/${key}/activeRemoved`]:
        true,

      [`orders/${key}/activeRemovedAt`]:
        now

    };


    await update(
      ref(db),
      updates
    );


    if(orders[key]){

      orders[key] = {

        ...orders[key],

        activeRemoved:
          true,

        activeRemovedAt:
          now

      };

    }


    knownNewOrderIds.add(key);


    renderOrders();

    renderNotificationList();


    showToast(
      "Order removed from Active Orders."
    );


  }catch(error){

    console.error(
      "REMOVE ACTIVE ORDER ERROR:",
      error
    );


    showToast(
      error.message ||
      "Could not update order."
    );

  }

};


/* =========================================================
   REMOVE ORDER
========================================================= */

window.removeOrder =
async function(key){

  try{

    const updates = {

      [`orders/${key}`]:
        null,

      [`deliveredOrders/${key}`]:
        null,

      [`cancelledOrders/${key}`]:
        null

    };


    const order =
      orders[key];


    if(order?.ownerUid){

      updates[
        `customerOrders/${order.ownerUid}/${key}`
      ] =
        null;

    }


    const customerId =
      order?.customerId ||
      order?.customerUID ||
      order?.uid ||
      null;


    if(
      customerId &&
      customerId !== order?.ownerUid
    ){

      updates[
        `customerOrders/${customerId}/${key}`
      ] =
        null;

    }


    await update(
      ref(db),
      updates
    );


    showToast(
      "Order removed."
    );


  }catch(error){

    console.error(error);


    showToast(
      error.message ||
      "Could not remove order."
    );

  }

};


/* =========================================================
   NOTIFICATIONS
========================================================= */

window.toggleNotifications =
function(){

  const panel =
    $("notificationPanel");


  if(!panel){
    return;
  }


  panel.classList.toggle(
    "show"
  );


  renderNotificationList();

};


window.closeNotifications =
function(){

  $("notificationPanel")
    ?.classList.remove(
      "show"
    );

};


function renderNotificationList(){

  const list =
    $("notificationList");


  if(!list){
    return;
  }


  const received =
    Object.entries(orders)
      .filter(
        ([,order])=>
          getOrderStatus(order) === "received" &&
          order.activeRemoved !== true
      )
      .sort(
        (a,b)=>
          Number(
            b[1].createdAt || 0
          ) -
          Number(
            a[1].createdAt || 0
          )
      );


  if(!received.length){

    list.innerHTML =
      `<div
        style="
          padding:12px;
          color:#666;
          font-size:9px;
        "
      >
        No new orders.
      </div>`;


    return;

  }


  list.innerHTML =
    received
      .map(
        ([key,order])=>`

          <div
            class="notification-item"
            onclick="selectNotification('${key}')"
          >

            <strong>
              🆕
              ${escapeHtml(
                order.orderId ||
                key
              )}
            </strong>

            <small>
              ${escapeHtml(
                order.customerName ||
                "Customer"
              )}
              •
              ₹${Number(
                order.total ||
                0
              )}
            </small>

          </div>

        `
      )
      .join("");

}


window.selectNotification =
function(key){

  closeNotifications();

  stopNotificationEffects();


  selectedFolder =
    "new";


  $("orderManagement")
    ?.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });


  setTimeout(
    ()=>{

      const card =
        document.querySelector(
          `[data-order-key="${CSS.escape(key)}"]`
        );


      if(card){

        card.scrollIntoView({
          behavior:"smooth",
          block:"center"
        });

      }

    },
    150
  );

};

   MODALS
========================================================= */

window.closeModal =
function(id){

  $(id)
    ?.classList.remove(
      "show"
    );

};


window.openModal =
function(id){

  $(id)
    ?.classList.add(
      "show"
    );

};


window.addEventListener(
  "click",
  event=>{

    document
      .querySelectorAll(
        ".modal"
      )
      .forEach(
        modal=>{

          if(
            event.target ===
            modal
          ){

            modal.classList.remove(
              "show"
            );

          }

        }
      );

  }
);
