<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>The Queen Fast Food - Admin</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#101010;
  color:#fff;
}

.login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:#1b1b1b;
  padding:30px;
  border-radius:15px;
  border:1px solid #444;
}

h1,h2{
  color:#f5c542;
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:8px 0 15px;
  background:#111;
  color:#fff;
  border:1px solid #444;
  border-radius:8px;
}

button{
  cursor:pointer;
}

.primary{
  width:100%;
  padding:13px;
  background:#f5c542;
  border:0;
  border-radius:8px;
  font-weight:bold;
}

.logout{
  background:#d33;
  color:#fff;
  border:0;
  padding:10px 18px;
  border-radius:8px;
}

#dashboard{
  display:none;
}

header{
  background:#181818;
  border-bottom:1px solid #333;
  padding:15px 4%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  color:#f5c542;
  font-size:22px;
  font-weight:bold;
}

.container{
  width:94%;
  max-width:1300px;
  margin:25px auto;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.stat{
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:12px;
  padding:20px;
}

.stat h3{
  color:#aaa;
  font-size:14px;
}

.stat strong{
  display:block;
  font-size:28px;
  color:#f5c542;
  margin-top:8px;
}

.panel{
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:12px;
  padding:20px;
  margin-top:20px;
}

.panel h2{
  margin-bottom:15px;
}

.shop-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.open-btn,
.close-btn{
  padding:12px 20px;
  border:0;
  border-radius:8px;
  font-weight:bold;
}

.open-btn{
  background:#2d9b4a;
  color:#fff;
}

.close-btn{
  background:#d33;
  color:#fff;
}

.order{
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  padding:18px;
  margin-top:15px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.order-id{
  color:#f5c542;
  font-size:20px;
  font-weight:bold;
}

.badge{
  padding:6px 10px;
  border-radius:15px;
  background:#f5c542;
  color:#000;
  font-weight:bold;
  font-size:12px;
}

.order-details{
  margin-top:15px;
  line-height:1.8;
  color:#ddd;
}

.order-items{
  margin-top:12px;
  padding:12px;
  background:#1c1c1c;
  border-radius:8px;
}

.status-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

.status-buttons button{
  padding:9px 12px;
  border:1px solid #555;
  border-radius:7px;
  background:#222;
  color:#fff;
}

.status-buttons button:hover{
  background:#f5c542;
  color:#000;
}

.whatsapp-btn{
  display:inline-block;
  margin-top:12px;
  padding:10px 15px;
  background:#20c65a;
  color:#fff;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

.empty{
  color:#aaa;
  text-align:center;
  padding:30px;
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.filters button{
  padding:9px 15px;
  border-radius:20px;
  border:1px solid #555;
  background:#222;
  color:#fff;
}

.filters button.active{
  background:#f5c542;
  color:#000;
}

.message{
  margin-top:10px;
  color:#f5c542;
}

@media(max-width:600px){

  header{
    padding:12px;
  }

  .logo{
    font-size:16px;
  }

  .container{
    width:95%;
  }

}

</style>

</head>

<body>


<!-- LOGIN -->

<div id="loginPage" class="login">

  <div class="login-box">

    <h1>👑 The Queen Fast Food</h1>

    <p style="margin:10px 0 20px;color:#aaa">
      Admin Panel
    </p>

    <input
      id="email"
      type="email"
      placeholder="Admin Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button
      class="primary"
      onclick="loginAdmin()"
    >
      🔐 Login
    </button>

    <div id="loginMessage"
         class="message"></div>

  </div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

<header>

  <div class="logo">
    👑 The Queen Fast Food — Admin
  </div>

  <button
    class="logout"
    onclick="logoutAdmin()"
  >
    Logout
  </button>

</header>


<div class="container">


<!-- STATS -->

<div class="stats">

  <div class="stat">

    <h3>Total Orders</h3>

    <strong id="totalOrders">
      0
    </strong>

  </div>


  <div class="stat">

    <h3>Today's Orders</h3>

    <strong id="todayOrders">
      0
    </strong>

  </div>


  <div class="stat">

    <h3>Pending Orders</h3>

    <strong id="pendingOrders">
      0
    </strong>

  </div>


  <div class="stat">

    <h3>Delivered</h3>

    <strong id="deliveredOrders">
      0
    </strong>

  </div>

</div>


<!-- SHOP CONTROL -->

<div class="panel">

  <h2>🏪 Shop Control</h2>

  <div id="shopStatus">
    Checking...
  </div>

  <br>

  <div class="shop-buttons">

    <button
      class="open-btn"
      onclick="openShop()"
    >
      🟢 Open Shop
    </button>

    <button
      class="close-btn"
      onclick="closeShop()"
    >
      🔴 Close Shop
    </button>

  </div>

  <textarea
    id="closedMessage"
    placeholder="Closed message"
  ></textarea>

</div>


<!-- SETTINGS -->

<div class="panel">

  <h2>⚙️ Restaurant Settings</h2>

  <label>WhatsApp Number</label>

  <input
    id="whatsappNumber"
    value="9090220791"
  >

  <button
    class="primary"
    onclick="saveSettings()"
  >
    💾 Save Settings
  </button>

  <div
    id="settingsMessage"
    class="message"
  ></div>

</div>


<!-- ORDERS -->

<div class="panel">

  <h2>📦 Customer Orders</h2>

  <div class="filters">

    <button
      id="filterAll"
      class="active"
      onclick="setFilter('all')"
    >
      All
    </button>

    <button
      id="filterPending"
      onclick="setFilter('pending')"
    >
      Pending
    </button>

    <button
      id="filterToday"
      onclick="setFilter('today')"
    >
      Today
    </button>

    <button
      id="filterDelivered"
      onclick="setFilter('delivered')"
    >
      Delivered
    </button>

  </div>

  <div id="ordersList">

    <div class="empty">
      Loading orders...
    </div>

  </div>

</div>

</div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue,
  update,
  set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBtJaMwLBSJP2d6QXa3ZRXkGIonok-erQg",

  authDomain:
    "the-queen-fast-food.firebaseapp.com",

  databaseURL:
    "https://the-queen-fast-food-default-rtdb.firebaseio.com",

  projectId:
    "the-queen-fast-food",

  storageBucket:
    "the-queen-fast-food.firebasestorage.app",

  messagingSenderId:
    "435721389652",

  appId:
    "1:435721389652:web:c4bec2b5d89a4e2ab50fc1",

  measurementId:
    "G-Q1YCK636KJ"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getDatabase(app);


/* =========================
   ADMIN UID
========================= */

const ADMIN_UID =
  "eWlMt1dG2pUOxsTo0NaXgY1avn33";


let ordersData = {};

let currentFilter = "all";

let settingsData = {};


/* =========================
   LOGIN
========================= */

window.loginAdmin = async function(){

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;


  if(!email || !password){

    document.getElementById(
      "loginMessage"
    ).textContent =
      "Enter email and password.";

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    document.getElementById(
      "loginMessage"
    ).textContent =
      "❌ Login failed: " +
      error.message;

  }

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      showLogin();

      return;
    }


    if(user.uid !== ADMIN_UID){

      alert(
        "This account is not authorized as admin."
      );

      await signOut(auth);

      return;
    }


    showDashboard();

    loadSettings();

    loadOrders();

  }
);


function showLogin(){

  document.getElementById(
    "loginPage"
  ).style.display = "flex";

  document.getElementById(
    "dashboard"
  ).style.display = "none";

}


function showDashboard(){

  document.getElementById(
    "loginPage"
  ).style.display = "none";

  document.getElementById(
    "dashboard"
  ).style.display = "block";

}


window.logoutAdmin = async function(){

  await signOut(auth);

};


/* =========================
   SETTINGS
========================= */

function loadSettings(){

  const settingsRef =
    ref(db,"settings");


  onValue(
    settingsRef,
    snapshot => {

      settingsData =
        snapshot.val() || {};


      document.getElementById(
        "whatsappNumber"
      ).value =
        settingsData.whatsappNumber ||
        "9090220791";


      document.getElementById(
        "closedMessage"
      ).value =
        settingsData.closedMessage ||
        "The Queen Fast Food is currently closed.";


      updateShopStatus();

    },

    error => {

      console.error(error);

    }
  );

}


/* =========================
   SHOP STATUS
========================= */

function updateShopStatus(){

  const manualClosed =
    settingsData.manualClosed === true;


  const el =
    document.getElementById(
      "shopStatus"
    );


  if(manualClosed){

    el.innerHTML =
      "🔴 Shop is manually CLOSED.";

    el.style.color =
      "#ff6666";

    return;
  }


  const now =
    new Date();


  const minutes =
    now.getHours() * 60 +
    now.getMinutes();


  const opening =
    12 * 60;

  const closing =
    23 * 60;


  if(
    minutes >= opening &&
    minutes < closing
  ){

    el.innerHTML =
      "🟢 Shop is OPEN • 12:00 PM – 11:00 PM";

    el.style.color =
      "#55dd77";

  }else{

    el.innerHTML =
      "🔴 Shop is CLOSED • 12:00 PM – 11:00 PM";

    el.style.color =
      "#ff6666";

  }

}


/* =========================
   OPEN SHOP
========================= */

window.openShop = async function(){

  try{

    await update(
      ref(db,"settings"),
      {

        manualClosed:false,

        manualOpenedAt:
          new Date().toISOString()

      }
    );


  }catch(error){

    alert(
      "Could not open shop."
    );

  }

};


/* =========================
   CLOSE SHOP
========================= */

window.closeShop = async function(){

  const message =
    document.getElementById(
      "closedMessage"
    ).value.trim() ||
    "The Queen Fast Food is currently closed.";


  try{

    await update(
      ref(db,"settings"),
      {

        manualClosed:true,

        closedMessage:message,

        manualClosedAt:
          new Date().toISOString()

      }
    );


  }catch(error){

    alert(
      "Could not close shop."
    );

  }

};


/* =========================
   SAVE SETTINGS
========================= */

window.saveSettings = async function(){

  const number =
    document.getElementById(
      "whatsappNumber"
    ).value.trim();


  const message =
    document.getElementById(
      "closedMessage"
    ).value.trim();


  try{

    await update(
      ref(db,"settings"),
      {

        whatsappNumber:
          number || "9090220791",

        closedMessage:
          message ||
          "The Queen Fast Food is currently closed."

      }
    );


    document.getElementById(
      "settingsMessage"
    ).textContent =
      "✅ Settings saved.";


  }catch(error){

    console.error(error);

    document.getElementById(
      "settingsMessage"
    ).textContent =
      "❌ Could not save settings.";

  }

};


/* =========================
   LOAD ORDERS
========================= */

function loadOrders(){

  const ordersRef =
    ref(db,"orders");


  onValue(

    ordersRef,

    snapshot => {

      ordersData =
        snapshot.val() || {};


      updateStats();

      renderOrders();

    },

    error => {

      console.error(
        "ORDER LOAD ERROR:",
        error
      );


      document.getElementById(
        "ordersList"
      ).innerHTML = `

        <div class="empty">

          ❌ Could not load orders.

          <br><br>

          Firebase permission denied.

        </div>

      `;

    }

  );

}


/* =========================
   STATS
========================= */

function updateStats(){

  const orders =
    Object.values(ordersData);


  document.getElementById(
    "totalOrders"
  ).textContent =
    orders.length;


  const today =
    new Date().toDateString();


  const todayOrders =
    orders.filter(order=>{

      if(!order.createdAt)
        return false;

      return new Date(
        order.createdAt
      ).toDateString() === today;

    });


  document.getElementById(
    "todayOrders"
  ).textContent =
    todayOrders.length;


  const pending =
    orders.filter(order=>
      !["delivered","cancelled"]
      .includes(order.status)
    );


  document.getElementById(
    "pendingOrders"
  ).textContent =
    pending.length;


  const delivered =
    orders.filter(order=>
      order.status === "delivered"
    );


  document.getElementById(
    "deliveredOrders"
  ).textContent =
    delivered.length;

}


/* =========================
   FILTER
========================= */

window.setFilter = function(filter){

  currentFilter = filter;


  document
    .querySelectorAll(".filters button")
    .forEach(btn=>
      btn.classList.remove("active")
    );


  const idMap = {

    all:"filterAll",

    pending:"filterPending",

    today:"filterToday",

    delivered:"filterDelivered"

  };


  document
    .getElementById(idMap[filter])
    .classList.add("active");


  renderOrders();

};


/* =========================
   RENDER ORDERS
========================= */

function renderOrders(){

  const container =
    document.getElementById(
      "ordersList"
    );


  let entries =
    Object.entries(ordersData);


  entries.sort(
    (a,b)=>{

      const dateA =
        new Date(
          a[1].createdAt || 0
        );

      const dateB =
        new Date(
          b[1].createdAt || 0
        );

      return dateB - dateA;

    }
  );


  entries =
    entries.filter(
      ([key,order])=>
        matchesFilter(order)
    );


  if(entries.length === 0){

    container.innerHTML = `

      <div class="empty">

        📦 No orders found.

      </div>

    `;

    return;
  }


  container.innerHTML = "";


  entries.forEach(
    ([firebaseKey,order])=>{

      container.innerHTML +=
        createOrderHTML(
          firebaseKey,
          order
        );

    }
  );

}


function matchesFilter(order){

  if(currentFilter === "all")
    return true;


  if(currentFilter === "pending"){

    return ![
      "delivered",
      "cancelled"
    ].includes(order.status);

  }


  if(currentFilter === "delivered"){

    return order.status ===
      "delivered";

  }


  if(currentFilter === "today"){

    if(!order.createdAt)
      return false;


    return new Date(
      order.createdAt
    ).toDateString() ===
      new Date().toDateString();

  }


  return true;

}


/* =========================
   ORDER HTML
========================= */

function createOrderHTML(
  firebaseKey,
  order
){

  const humanOrderId =
    order.orderId ||
    firebaseKey;


  const status =
    formatStatus(order.status);


  let itemsHTML = "";


  if(Array.isArray(order.items)){

    order.items.forEach(item=>{

      itemsHTML += `

        <div>
          🍽️ ${item.name}
          × ${item.quantity}
          = ₹${item.amount ||
          item.price * item.quantity}
        </div>

      `;

    });

  }


  const whatsapp =
    String(
      settingsData.whatsappNumber ||
      "9090220791"
    ).replace(/\D/g,"");


  return `

    <div class="order">

      <div class="order-top">

        <div>

          <div class="order-id">
            🆔 ${humanOrderId}
          </div>

          <small>
            ${formatDate(order.createdAt)}
          </small>

        </div>

        <div class="badge">
          ${status}
        </div>

      </div>


      <div class="order-details">

        👤 <strong>Customer:</strong>
        ${escapeHTML(order.customerName || "-")}

        <br>

        📞 <strong>Phone:</strong>
        ${escapeHTML(order.phone || "-")}

        <br>

        📍 <strong>Address:</strong>
        ${escapeHTML(order.address || "-")}

        <br>

        💳 <strong>Payment:</strong>
        ${escapeHTML(order.paymentMethod || "-")}

        <br>

        📏 <strong>Distance:</strong>
        ${order.distanceKm || 0} KM

      </div>


      <div class="order-items">

        <strong>🍽️ Items</strong>

        <br><br>

        ${itemsHTML}

      </div>


      <div class="order-details">

        💰 Food Total:
        ₹${order.subtotal || 0}

        <br>

        🚚 Delivery:
        ₹${order.deliveryCharge || 0}

        <br>

        <strong style="color:#f5c542;font-size:20px">

          💵 Total:
          ₹${order.total || 0}

        </strong>

      </div>


      <div class="status-buttons">

        <button
          onclick="changeOrderStatus(
            '${firebaseKey}',
            'received'
          )"
        >
          📥 Received
        </button>


        <button
          onclick="changeOrderStatus(
            '${firebaseKey}',
            'confirmed'
          )"
        >
          ✅ Confirmed
        </button>


        <button
          onclick="changeOrderStatus(
            '${firebaseKey}',
            'preparing'
          )"
        >
          👨‍🍳 Preparing
        </button>


        <button
          onclick="changeOrderStatus(
            '${firebaseKey}',
            'out_for_delivery'
          )"
        >
          🛵 Out for Delivery
        </button>


        <button
          onclick="changeOrderStatus(
            '${firebaseKey}',
            'delivered'
          )"
        >
          🎉 Delivered
        </button>


        <button
          onclick="changeOrderStatus(
            '${firebaseKey}',
            'cancelled'
          )"
        >
          ❌ Cancelled
        </button>

      </div>


      <a
        class="whatsapp-btn"
        target="_blank"
        href="https://wa.me/91${whatsapp}"
      >
        📲 Open Restaurant WhatsApp
      </a>

    </div>

  `;

}


/* =========================
   CHANGE STATUS
========================= */

window.changeOrderStatus =
async function(
  firebaseKey,
  newStatus
){

  try{

    await update(

      ref(
        db,
        "orders/" +
        firebaseKey
      ),

      {

        status:newStatus,

        statusUpdatedAt:
          new Date().toISOString()

      }

    );


  }catch(error){

    console.error(error);

    alert(
      "Could not update order status."
    );

  }

};


/* =========================
   HELPERS
========================= */

function formatStatus(status){

  const map = {

    received:"Received",

    confirmed:"Confirmed",

    preparing:"Making / Preparing",

    out_for_delivery:
      "Out for Delivery",

    delivered:"Delivered",

    cancelled:"Cancelled"

  };


  return map[status] ||
    "Received";

}


function formatDate(value){

  if(!value)
    return "-";


  return new Date(value)
    .toLocaleString(
      "en-IN",
      {
        dateStyle:"medium",
        timeStyle:"short"
      }
    );

}


function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
