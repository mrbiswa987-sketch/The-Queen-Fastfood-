<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Queen Fast Food — Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0b;
  color:#fff;
}

header{
  background:#111;
  padding:20px;
  text-align:center;
  border-bottom:1px solid #333;
}

.logo{
  color:#d4af37;
  font-size:25px;
  font-weight:bold;
}

.logo span{
  display:block;
  color:#fff;
  font-size:15px;
  margin-top:4px;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#151515;
  border:1px solid #333;
  border-radius:14px;
  padding:22px;
  margin-bottom:20px;
}

h2{
  color:#d4af37;
  margin-bottom:18px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #444;
  background:#222;
  color:#fff;
  font-size:15px;
}

button{
  border:none;
  border-radius:8px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:bold;
  margin:4px;
}

.login-btn{
  width:100%;
  background:#d4af37;
  color:#000;
}

.logout{
  background:#b3261e;
  color:#fff;
}

.status-btn{
  background:#333;
  color:#fff;
}

.status-btn:hover{
  background:#d4af37;
  color:#000;
}

.order{
  background:#101010;
  border:1px solid #333;
  border-radius:12px;
  padding:20px;
  margin-bottom:18px;
}

.order-id{
  color:#d4af37;
  font-size:20px;
  font-weight:bold;
}

.status{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  background:#222;
  margin:10px 0;
  color:#d4af37;
}

.info{
  line-height:1.8;
  color:#ddd;
}

.items{
  margin:12px 0;
  padding:12px;
  background:#181818;
  border-radius:8px;
  line-height:1.8;
}

.total{
  color:#d4af37;
  font-size:19px;
  font-weight:bold;
}

.hidden{
  display:none;
}

.empty{
  text-align:center;
  color:#888;
  padding:30px;
}

.error-box{
  background:#2b1010;
  border:1px solid #8b3030;
  color:#ff7777;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}

.success-box{
  background:#102b18;
  border:1px solid #2d7a45;
  color:#72e39a;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}

.order-count{
  color:#d4af37;
  font-size:18px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    👑 THE QUEEN
    <span>FAST FOOD — ADMIN PANEL</span>
  </div>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginSection" class="card">

    <h2>🔐 Admin Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button
      class="login-btn"
      onclick="login()">
      LOGIN
    </button>

    <p
      id="loginError"
      style="color:#ff5555;margin-top:12px;">
    </p>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="card">

      <h2>📊 Order Dashboard</h2>

      <button
        class="logout"
        onclick="logout()">
        Logout
      </button>

      <p style="margin-top:12px;color:#aaa;">
        Live orders from The Queen Fast Food
      </p>

      <p
        id="connectionStatus"
        style="margin-top:12px;">
        🔄 Connecting to Firebase...
      </p>

      <p
        id="orderCount"
        class="order-count"
        style="margin-top:10px;">
        Orders: 0
      </p>

    </div>

    <div id="orders">
      <div class="card empty">
        Loading orders...
      </div>
    </div>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue,
  update
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBtJaMwLBSJP2d6QXa3ZRXkGIonok-erQg",

  authDomain:
    "the-queen-fast-food.firebaseapp.com",

  databaseURL:
    "https://the-queen-fast-food-default-rtdb.firebaseio.com",

  projectId:
    "the-queen-fast-food",

  storageBucket:
    "the-queen-fast-food.firebasestorage.app",

  messagingSenderId:
    "435721389652",

  appId:
    "1:435721389652:web:c4bec2b5d89a4e2ab50fc1",

  measurementId:
    "G-Q1YCK636KJ"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


/* =========================
   LOGIN
========================= */

window.login = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("loginError");

  error.textContent = "";

  if(!email || !password){

    error.textContent =
      "Please enter email and password.";

    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(err){

    console.error(
      "LOGIN ERROR:",
      err
    );

    error.textContent =
      err.message;

  }

};


/* =========================
   LOGOUT
========================= */

window.logout = async function(){

  try{

    await signOut(auth);

  }catch(err){

    console.error(
      "LOGOUT ERROR:",
      err
    );

  }

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  user => {

    const loginSection =
      document.getElementById(
        "loginSection"
      );

    const dashboard =
      document.getElementById(
        "dashboard"
      );

    if(user){

      loginSection.classList.add(
        "hidden"
      );

      dashboard.classList.remove(
        "hidden"
      );

      console.log(
        "ADMIN LOGGED IN:",
        user.uid
      );

      loadOrders();

    }else{

      loginSection.classList.remove(
        "hidden"
      );

      dashboard.classList.add(
        "hidden"
      );

    }

  }
);


/* =========================
   LIVE ORDERS
========================= */

function loadOrders(){

  const ordersRef =
    ref(db,"orders");

  const connectionStatus =
    document.getElementById(
      "connectionStatus"
    );

  const ordersContainer =
    document.getElementById(
      "orders"
    );

  connectionStatus.innerHTML =
    "🔄 Connecting to Firebase...";

  onValue(

    ordersRef,

    snapshot => {

      console.log(
        "FIREBASE SNAPSHOT:",
        snapshot.val()
      );

      connectionStatus.innerHTML =
        "🟢 Firebase Connected";

      ordersContainer.innerHTML = "";

      if(!snapshot.exists()){

        ordersContainer.innerHTML = `
          <div class="card empty">
            📦 No orders yet
          </div>
        `;

        document.getElementById(
          "orderCount"
        ).textContent =
          "Orders: 0";

        return;
      }


      const data =
        snapshot.val();


      const orders =
        Object.entries(data);


      /* newest first */

      orders.sort(
        (a,b) => {

          const timeA =
            Number(
              a[1].createdAt || 0
            );

          const timeB =
            Number(
              b[1].createdAt || 0
            );

          return timeB - timeA;

        }
      );


      document.getElementById(
        "orderCount"
      ).textContent =
        "Orders: " + orders.length;


      orders.forEach(
        ([orderId,order]) => {

          ordersContainer.innerHTML +=
            createOrderCard(
              orderId,
              order
            );

        }
      );

    },

    error => {

      console.error(
        "FIREBASE READ ERROR:",
        error
      );

      connectionStatus.innerHTML =
        "🔴 Firebase Error";

      ordersContainer.innerHTML = `
        <div class="error-box">

          <b>❌ Unable to load orders</b>

          <br><br>

          ${escapeHTML(
            error.message ||
            "Firebase database read failed."
          )}

          <br><br>

          Check Firebase Realtime Database
          rules and authentication.

        </div>
      `;

    }

  );

}


/* =========================
   ORDER CARD
========================= */

function createOrderCard(
  orderId,
  order
){

  const customer =
    order.customer || {};

  const items =
    Array.isArray(order.items)
      ? order.items
      : [];

  let itemHTML = "";


  items.forEach(
    item => {

      const price =
        Number(item.price || 0);

      const quantity =
        Number(item.quantity || 0);

      itemHTML += `
        <div>
          🍴 ${escapeHTML(
            item.name || "Item"
          )}

          × ${quantity}

          = ₹${price * quantity}
        </div>
      `;

    }
  );


  const status =
    order.status || "received";


  const createdAt =
    order.createdAt
      ? new Date(
          Number(order.createdAt)
        ).toLocaleString("en-IN")
      : "N/A";


  return `

    <div class="order">

      <div class="order-id">
        🆔 ${escapeHTML(orderId)}
      </div>


      <div class="status">
        ${getStatusText(status)}
      </div>


      <div class="info">

        👤 <b>Name:</b>
        ${escapeHTML(
          customer.name || "N/A"
        )}

        <br>

        📱 <b>Mobile:</b>
        ${escapeHTML(
          customer.phone || "N/A"
        )}

        <br>

        🏠 <b>Address:</b>
        ${escapeHTML(
          customer.address || "N/A"
        )}

        <br>

        💳 <b>Payment:</b>
        ${escapeHTML(
          order.payment || "N/A"
        )}

        <br>

        🕐 <b>Order Time:</b>
        ${escapeHTML(createdAt)}

      </div>


      <div class="items">

        <b>🛒 ORDER ITEMS</b>

        <br><br>

        ${
          itemHTML ||
          "No items found."
        }

      </div>


      <div class="info">

        💰 Subtotal:
        ₹${Number(
          order.subtotal || 0
        )}

        <br>

        🛵 Delivery:
        ₹${Number(
          order.deliveryCharge || 0
        )}

        <br><br>

        <span class="total">

          GRAND TOTAL:
          ₹${Number(
            order.grandTotal || 0
          )}

        </span>

      </div>


      <hr
        style="
          border-color:#333;
          margin:18px 0;
        "
      >


      <b style="color:#d4af37;">
        UPDATE ORDER STATUS
      </b>

      <br>


      <button
        class="status-btn"
        onclick="
          changeStatus(
            '${escapeJS(orderId)}',
            'received'
          )
        ">
        🟢 Received
      </button>


      <button
        class="status-btn"
        onclick="
          changeStatus(
            '${escapeJS(orderId)}',
            'confirmed'
          )
        ">
        🟡 Confirmed
      </button>


      <button
        class="status-btn"
        onclick="
          changeStatus(
            '${escapeJS(orderId)}',
            'making'
          )
        ">
        👨‍🍳 Making
      </button>


      <button
        class="status-btn"
        onclick="
          changeStatus(
            '${escapeJS(orderId)}',
            'out_for_delivery'
          )
        ">
        🛵 Out for Delivery
      </button>


      <button
        class="status-btn"
        onclick="
          changeStatus(
            '${escapeJS(orderId)}',
            'delivered'
          )
        ">
        ✅ Delivered
      </button>


      ${
        customer.lat &&
        customer.lng
        ?
        `

        <br><br>

        <a
          href="
            https://www.google.com/maps?q=
            ${customer.lat},
            ${customer.lng}
          "
          target="_blank"
          style="
            color:#d4af37;
            font-weight:bold;
          "
        >
          📍 Open Customer Location
        </a>

        `
        :
        ""
      }

    </div>

  `;

}


/* =========================
   CHANGE STATUS
========================= */

window.changeStatus =
async function(
  orderId,
  status
){

  try{

    await update(
      ref(
        db,
        "orders/" + orderId
      ),
      {
        status:
          status,

        updatedAt:
          Date.now()
      }
    );

  }catch(err){

    console.error(
      "STATUS UPDATE ERROR:",
      err
    );

    alert(
      "Unable to update order status:\n" +
      err.message
    );

  }

};


/* =========================
   STATUS TEXT
========================= */

function getStatusText(
  status
){

  const map = {

    received:
      "🟢 Order Received",

    confirmed:
      "🟡 Order Confirmed",

    making:
      "👨‍🍳 Your Order Is Making",

    out_for_delivery:
      "🛵 Out for Delivery",

    delivered:
      "✅ Delivered"

  };

  return (
    map[status] ||
    "🟢 Order Received"
  );

}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(
  value
){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeJS(
  value
){

  return String(value)
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    );

}

</script>

</body>
</html>
