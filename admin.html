<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Queen Fast Food - Admin</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0d0d0d;
  color:#fff;
}

header{
  background:#111;
  border-bottom:1px solid #333;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#f5c542;
  font-size:22px;
  font-weight:bold;
}

.container{
  width:92%;
  max-width:1200px;
  margin:auto;
}

.section{
  padding:30px 0;
}

.card{
  background:#161616;
  border:1px solid #333;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}

h2,h3{
  color:#f5c542;
  margin-bottom:15px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  margin:7px 0 14px;
  border-radius:10px;
  border:1px solid #444;
  background:#222;
  color:#fff;
}

button{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#f5c542;
  color:#111;
}

.danger{
  background:#d9534f;
  color:#fff;
}

.gray{
  background:#333;
  color:#fff;
}

.login{
  max-width:450px;
  margin:100px auto;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.stat{
  background:#181818;
  border:1px solid #333;
  border-radius:15px;
  padding:20px;
}

.stat-number{
  font-size:30px;
  color:#f5c542;
  font-weight:bold;
}

.order{
  background:#181818;
  border:1px solid #333;
  border-radius:17px;
  padding:20px;
  margin-bottom:15px;
}

.order-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.order-id{
  color:#f5c542;
  font-size:21px;
  font-weight:bold;
}

.status{
  display:inline-block;
  padding:6px 11px;
  background:#f5c542;
  color:#111;
  border-radius:20px;
  font-weight:bold;
}

.order-items{
  margin:15px 0;
  padding:15px;
  background:#222;
  border-radius:10px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.rating{
  background:#181818;
  border:1px solid #333;
  border-radius:17px;
  padding:20px;
  margin-bottom:15px;
}

.stars{
  font-size:25px;
  margin:8px 0;
}

.hidden{
  display:none;
}

.small{
  color:#aaa;
  font-size:13px;
}

</style>
</head>

<body>

<header>

  <div class="logo">
    👑 The Queen Fast Food
  </div>

  <button
    id="logoutBtn"
    class="danger hidden"
    onclick="logout()"
  >
    Logout
  </button>

</header>


<!-- LOGIN -->

<div id="loginScreen" class="login card">

  <h2>🔐 Admin Login</h2>

  <input
    id="email"
    type="email"
    placeholder="Admin Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button
    class="primary"
    style="width:100%"
    onclick="adminLogin()"
  >
    Login
  </button>

  <p
    id="loginMessage"
    class="small"
    style="margin-top:15px"
  ></p>

</div>


<!-- ADMIN -->

<div
  id="adminPanel"
  class="container section hidden"
>

  <h2>📊 Admin Dashboard</h2>

  <div class="stats">

    <div class="stat">
      <div>Total Orders</div>
      <div id="totalOrders" class="stat-number">
        0
      </div>
    </div>

    <div class="stat">
      <div>Today's Orders</div>
      <div id="todayOrders" class="stat-number">
        0
      </div>
    </div>

    <div class="stat">
      <div>Pending</div>
      <div id="pendingOrders" class="stat-number">
        0
      </div>
    </div>

    <div class="stat">
      <div>Delivered</div>
      <div id="deliveredOrders" class="stat-number">
        0
      </div>
    </div>

  </div>


  <!-- SHOP SETTINGS -->

  <div class="card">

    <h3>🏪 Shop Control</h3>

    <button
      class="primary"
      onclick="toggleShop()"
    >
      Toggle Shop Open / Closed
    </button>

    <p
      id="shopStatus"
      style="margin-top:15px"
    >
      Loading...
    </p>

    <br>

    <label>Closed Message</label>

    <input
      id="closedMessage"
      placeholder="Shop is currently closed."
    >

    <button
      class="primary"
      onclick="saveShopSettings()"
    >
      Save Shop Settings
    </button>

  </div>


  <!-- WHATSAPP -->

  <div class="card">

    <h3>📲 WhatsApp Number</h3>

    <input
      id="whatsappNumber"
      value="9090220791"
      placeholder="WhatsApp Number"
    >

    <button
      class="primary"
      onclick="saveWhatsApp()"
    >
      Save WhatsApp
    </button>

  </div>


  <!-- FILTER -->

  <div class="card">

    <h3>🔎 Orders</h3>

    <select
      id="orderFilter"
      onchange="renderOrders()"
    >

      <option value="all">
        All Orders
      </option>

      <option value="pending">
        Pending
      </option>

      <option value="today">
        Today
      </option>

      <option value="delivered">
        Delivered
      </option>

    </select>

    <div id="ordersList"></div>

  </div>


  <!-- RATINGS -->

  <div class="card">

    <h3>⭐ Customer Ratings & Feedback</h3>

    <div id="ratingsList">
      Loading ratings...
    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  update,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBtJaMwLBSJP2d6QXa3ZRXkGIonok-erQg",

  authDomain:
    "the-queen-fast-food.firebaseapp.com",

  databaseURL:
    "https://the-queen-fast-food-default-rtdb.firebaseio.com",

  projectId:
    "the-queen-fast-food",

  storageBucket:
    "the-queen-fast-food.firebasestorage.app",

  messagingSenderId:
    "435721389652",

  appId:
    "1:435721389652:web:c4bec2b5d89a4e2ab50fc1",

  measurementId:
    "G-Q1YCK636KJ"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);

const auth =
  getAuth(app);


/* =========================
   ADMIN UID
========================= */

const ADMIN_UID =
  "eWlMt1dG2pUOxsTo0NaXgY1avn33";


let allOrders = {};

let allRatings = {};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      showLogin();

      return;

    }


    if(user.uid !== ADMIN_UID){

      alert(
        "Access denied. Admin account only."
      );

      signOut(auth);

      return;

    }


    showAdmin();

    startRealtimeListeners();

  }
);


/* =========================
   LOGIN
========================= */

window.adminLogin = async function(){

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;


  if(!email || !password){

    document.getElementById("loginMessage")
      .textContent =
      "Please enter email and password.";

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    document.getElementById("loginMessage")
      .textContent =
      "❌ Login failed. Check email/password.";

  }

};


/* =========================
   LOGOUT
========================= */

window.logout = async function(){

  await signOut(auth);

};


function showLogin(){

  document.getElementById("loginScreen")
    .classList.remove("hidden");

  document.getElementById("adminPanel")
    .classList.add("hidden");

  document.getElementById("logoutBtn")
    .classList.add("hidden");

}


function showAdmin(){

  document.getElementById("loginScreen")
    .classList.add("hidden");

  document.getElementById("adminPanel")
    .classList.remove("hidden");

  document.getElementById("logoutBtn")
    .classList.remove("hidden");

}


/* =========================
   REALTIME
========================= */

function startRealtimeListeners(){

  onValue(
    ref(db,"orders"),
    snapshot => {

      allOrders =
        snapshot.val() || {};

      updateStats();

      renderOrders();

    }
  );


  onValue(
    ref(db,"ratings"),
    snapshot => {

      allRatings =
        snapshot.val() || {};

      renderRatings();

    }
  );


  onValue(
    ref(db,"settings"),
    snapshot => {

      const settings =
        snapshot.val() || {};

      updateSettingsUI(settings);

    }
  );

}


/* =========================
   STATS
========================= */

function updateStats(){

  const orders =
    Object.values(allOrders);

  const today =
    new Date().toDateString();


  const todayOrders =
    orders.filter(order => {

      if(!order.createdAt)
        return false;

      return new Date(
        order.createdAt
      ).toDateString() === today;

    });


  const pending =
    orders.filter(order =>
      ![
        "delivered",
        "cancelled"
      ].includes(order.status)
    );


  const delivered =
    orders.filter(order =>
      order.status === "delivered"
    );


  document.getElementById(
    "totalOrders"
  ).textContent =
    orders.length;


  document.getElementById(
    "todayOrders"
  ).textContent =
    todayOrders.length;


  document.getElementById(
    "pendingOrders"
  ).textContent =
    pending.length;


  document.getElementById(
    "deliveredOrders"
  ).textContent =
    delivered.length;

}


/* =========================
   RENDER ORDERS
========================= */

window.renderOrders = function(){

  const box =
    document.getElementById("ordersList");

  const filter =
    document.getElementById("orderFilter")
      .value;


  let orders =
    Object.entries(allOrders);


  orders.sort((a,b)=>{

    return new Date(
      b[1].createdAt || 0
    ) -
    new Date(
      a[1].createdAt || 0
    );

  });


  orders =
    orders.filter(([key,order])=>{

      if(filter === "pending"){

        return ![
          "delivered",
          "cancelled"
        ].includes(order.status);

      }


      if(filter === "delivered"){

        return order.status === "delivered";

      }


      if(filter === "today"){

        if(!order.createdAt)
          return false;

        return new Date(
          order.createdAt
        ).toDateString()
        ===
        new Date().toDateString();

      }


      return true;

    });


  if(!orders.length){

    box.innerHTML =
      "<p class='small'>No orders found.</p>";

    return;

  }


  box.innerHTML = "";


  orders.forEach(
    ([firebaseKey,order])=>{

      let itemsHtml = "";


      (order.items || []).forEach(item=>{

        itemsHtml += `
          • ${escapeHtml(item.name)}
          × ${item.quantity}
          = ₹${item.total}
          <br>
        `;

      });


      box.innerHTML += `

        <div class="order">

          <div class="order-header">

            <div>

              <div class="order-id">
                🆔 ${escapeHtml(order.orderId)}
              </div>

              <div class="small">
                ${formatDate(order.createdAt)}
              </div>

            </div>

            <div class="status">
              ${formatStatus(order.status)}
            </div>

          </div>


          <br>


          <strong>👤 Customer:</strong>
          ${escapeHtml(order.customerName)}

          <br>

          <strong>📞 Phone:</strong>
          ${escapeHtml(order.phone)}

          <br><br>

          <strong>📍 Address:</strong>
          ${escapeHtml(order.address)}

          <div class="order-items">

            <strong>🍽️ Items</strong>

            <br><br>

            ${itemsHtml}

          </div>


          <strong>💰 Food Total:</strong>
          ₹${order.subtotal}

          <br>

          <strong>🚚 Delivery:</strong>
          ₹${order.deliveryCharge}

          <br>

          <strong>📏 Distance:</strong>
          ${order.distanceKm} KM

          <br>

          <strong>💵 Total:</strong>
          ₹${order.total}

          <br>

          <strong>💳 Payment:</strong>
          ${escapeHtml(order.paymentMethod)}


          <div class="actions">

            <button
              class="gray"
              onclick="updateOrderStatus(
                '${firebaseKey}',
                'received'
              )"
            >
              📥 Received
            </button>


            <button
              class="gray"
              onclick="updateOrderStatus(
                '${firebaseKey}',
                'confirmed'
              )"
            >
              ✅ Confirmed
            </button>


            <button
              class="gray"
              onclick="updateOrderStatus(
                '${firebaseKey}',
                'preparing'
              )"
            >
              👨‍🍳 Preparing
            </button>


            <button
              class="gray"
              onclick="updateOrderStatus(
                '${firebaseKey}',
                'out_for_delivery'
              )"
            >
              🛵 Out for Delivery
            </button>


            <button
              class="primary"
              onclick="updateOrderStatus(
                '${firebaseKey}',
                'delivered'
              )"
            >
              🎉 Delivered
            </button>


            <button
              class="danger"
              onclick="updateOrderStatus(
                '${firebaseKey}',
                'cancelled'
              )"
            >
              ❌ Cancel
            </button>

          </div>

        </div>

      `;

    }
  );

};


/* =========================
   UPDATE ORDER STATUS
========================= */

window.updateOrderStatus =
async function(firebaseKey,newStatus){

  try{

    const order =
      allOrders[firebaseKey];

    if(!order){

      alert("Order not found.");

      return;

    }


    const now =
      new Date().toISOString();


    const updates = {};


    /*
      Update main admin order
    */

    updates[
      `orders/${firebaseKey}/status`
    ] = newStatus;


    updates[
      `orders/${firebaseKey}/statusUpdatedAt`
    ] = now;


    /*
      Update customer's copy
    */

    updates[
      `customerOrders/${order.ownerUid}/${firebaseKey}/status`
    ] = newStatus;


    updates[
      `customerOrders/${order.ownerUid}/${firebaseKey}/statusUpdatedAt`
    ] = now;


    await update(
      ref(db),
      updates
    );


  }catch(error){

    console.error(error);

    alert(
      "Could not update order status."
    );

  }

};


/* =========================
   SETTINGS
========================= */

function updateSettingsUI(settings){

  const manualClosed =
    settings.manualClosed === true;


  document.getElementById(
    "shopStatus"
  ).innerHTML = manualClosed
    ? "🔴 MANUALLY CLOSED"
    : "🟢 SHOP OPEN / AUTO TIMING";


  document.getElementById(
    "closedMessage"
  ).value =
    settings.closedMessage ||
    "Shop is currently closed.";


  document.getElementById(
    "whatsappNumber"
  ).value =
    settings.whatsappNumber ||
    "9090220791";

}


window.toggleShop = async function(){

  const snap =
    await get(ref(db,"settings"));

  const settings =
    snap.exists()
    ? snap.val()
    : {};


  const current =
    settings.manualClosed === true;


  await update(
    ref(db,"settings"),
    {
      manualClosed:!current
    }
  );

};


window.saveShopSettings = async function(){

  const message =
    document.getElementById(
      "closedMessage"
    ).value.trim();


  await update(
    ref(db,"settings"),
    {
      closedMessage:
        message ||
        "Shop is currently closed."
    }
  );


  alert(
    "Shop settings saved."
  );

};


window.saveWhatsApp = async function(){

  const number =
    document.getElementById(
      "whatsappNumber"
    ).value
      .replace(/\D/g,"");


  if(number.length < 10){

    alert(
      "Please enter valid WhatsApp number."
    );

    return;

  }


  await update(
    ref(db,"settings"),
    {
      whatsappNumber:number
    }
  );


  alert(
    "WhatsApp number saved."
  );

};


/* =========================
   RATINGS
========================= */

function renderRatings(){

  const box =
    document.getElementById(
      "ratingsList"
    );


  const ratings =
    Object.entries(allRatings);


  ratings.sort((a,b)=>{

    return new Date(
      b[1].createdAt || 0
    ) -
    new Date(
      a[1].createdAt || 0
    );

  });


  if(!ratings.length){

    box.innerHTML =
      "<p class='small'>No ratings yet.</p>";

    return;

  }


  let total = 0;


  ratings.forEach(
    ([key,rating])=>{

      total +=
        Number(rating.rating || 0);

    }
  );


  const average =
    total / ratings.length;


  box.innerHTML = `

    <div class="card">

      <h3>
        ⭐ Average Rating:
        ${average.toFixed(1)} / 5
      </h3>

      <p class="small">
        ${ratings.length}
        customer rating(s)
      </p>

    </div>

  `;


  ratings.forEach(
    ([key,rating])=>{

      const stars =
        "⭐".repeat(
          Number(rating.rating || 0)
        );


      box.innerHTML += `

        <div class="rating">

          <strong>
            🆔 Order ID:
            ${escapeHtml(rating.orderId)}
          </strong>

          <div class="stars">
            ${stars}
          </div>

          <p>
            ${escapeHtml(
              rating.feedback ||
              "No written feedback."
            )}
          </p>

          <br>

          <div class="small">
            📅
            ${formatDate(
              rating.createdAt
            )}
          </div>

        </div>

      `;

    }
  );

}


/* =========================
   HELPERS
========================= */

function formatStatus(status){

  const map = {

    received:"📥 Received",

    confirmed:"✅ Confirmed",

    preparing:"👨‍🍳 Preparing",

    out_for_delivery:"🛵 Out for Delivery",

    delivered:"🎉 Delivered",

    cancelled:"❌ Cancelled"

  };

  return map[status] || status;

}


function formatDate(date){

  if(!date)
    return "-";

  return new Date(date)
    .toLocaleString("en-IN");

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
