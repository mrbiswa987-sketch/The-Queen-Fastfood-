<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070707">
<title>The Queen Fast Food</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --orange:#ff7a00;
  --orange2:#ff9d3d;
  --gold:#d4af37;
  --black:#070707;
  --card:#111111;
  --muted:#9b9b9b;
  --white:#ffffff;
  --danger:#ff3b30;
  --green:#22c55e;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--black);
  color:var(--white);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(7,7,7,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,122,0,.18);
}

.navbar{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#fff;
  text-decoration:none;
}

.logo-crown{
  font-size:28px;
  filter:drop-shadow(0 0 8px rgba(255,122,0,.45));
}

.logo-text{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
  font-weight:700;
  letter-spacing:.5px;
}

.logo-text span{
  color:var(--orange);
}

.nav-links{
  display:flex;
  align-items:center;
  gap:28px;
}

.nav-links a{
  color:#ddd;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
  transition:.25s;
}

.nav-links a:hover{
  color:var(--orange);
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.12);
  background:#101010;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  transition:.25s;
}

.icon-btn:hover{
  border-color:var(--orange);
  color:var(--orange);
  transform:translateY(-1px);
}

.cart-count{
  position:absolute;
  margin:-30px 0 0 27px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:20px;
  background:var(--orange);
  color:#000;
  font-size:10px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= HERO ================= */

.hero{
  position:relative;
  min-height:600px;
  display:flex;
  align-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 80% 30%,rgba(255,122,0,.18),transparent 35%),
    radial-gradient(circle at 10% 80%,rgba(255,122,0,.08),transparent 35%);
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    rgba(7,7,7,1) 0%,
    rgba(7,7,7,.88) 45%,
    rgba(7,7,7,.45) 100%
  );
  pointer-events:none;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:650px;
  padding:80px 0;
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border:1px solid rgba(255,122,0,.35);
  border-radius:999px;
  color:var(--orange2);
  background:rgba(255,122,0,.07);
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:22px;
}

.hero h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(58px,8vw,94px);
  line-height:.9;
  font-weight:700;
  letter-spacing:-2px;
}

.hero h1 span{
  color:var(--orange);
}

.hero p{
  margin-top:24px;
  color:#bcbcbc;
  font-size:16px;
  line-height:1.8;
  max-width:570px;
}

.hero-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:30px;
}

.primary-btn,
.secondary-btn{
  min-height:48px;
  padding:0 22px;
  border-radius:12px;
  font-size:14px;
  font-weight:800;
  border:1px solid transparent;
  transition:.25s;
}

.primary-btn{
  background:var(--orange);
  color:#080808;
}

.primary-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(255,122,0,.22);
}

.secondary-btn{
  background:#111;
  color:#fff;
  border-color:#292929;
}

.secondary-btn:hover{
  border-color:var(--orange);
  color:var(--orange);
}

/* ================= SECTION ================= */

section{
  padding:78px 0;
}

.section-head{
  text-align:center;
  margin-bottom:38px;
}

.section-kicker{
  color:var(--orange);
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:11px;
  font-weight:800;
}

.section-title{
  margin-top:8px;
  font-family:'Cormorant Garamond',serif;
  font-size:48px;
  font-weight:700;
}

.section-subtitle{
  margin:10px auto 0;
  color:#888;
  max-width:620px;
  line-height:1.7;
  font-size:14px;
}

/* ================= MENU ================= */

.menu-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.menu-card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,#151515,#0d0d0d);
  border:1px solid #222;
  border-radius:18px;
  transition:.3s;
}

.menu-card:hover{
  transform:translateY(-5px);
  border-color:rgba(255,122,0,.45);
  box-shadow:0 18px 45px rgba(0,0,0,.3);
}

.menu-image{
  height:190px;
  background:#181818;
  position:relative;
  overflow:hidden;
}

.menu-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.menu-image.no-image{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#444;
  font-size:45px;
}

.stock-badge{
  position:absolute;
  top:10px;
  right:10px;
  padding:5px 9px;
  border-radius:999px;
  background:rgba(7,7,7,.78);
  backdrop-filter:blur(8px);
  font-size:10px;
  font-weight:800;
}

.stock-badge.available{
  color:#7df3a3;
}

.stock-badge.unavailable{
  color:#ff7070;
}

.menu-info{
  padding:16px;
}

.menu-name{
  font-family:'Cormorant Garamond',serif;
  font-size:24px;
  font-weight:700;
}

.menu-description{
  color:#777;
  font-size:12px;
  line-height:1.6;
  margin-top:5px;
  min-height:38px;
}

.menu-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:14px;
}

.menu-price{
  color:var(--orange2);
  font-size:19px;
  font-weight:800;
}

.add-btn{
  border:0;
  background:var(--orange);
  color:#000;
  padding:9px 14px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
}

.add-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* ================= OFFER ================= */

.offer-circle{
  position:fixed;
  right:22px;
  bottom:22px;
  width:74px;
  height:74px;
  border-radius:50%;
  z-index:900;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle,#ffb15e,#ff7a00 65%,#b84e00);
  box-shadow:0 10px 35px rgba(255,122,0,.3);
  border:2px solid rgba(255,255,255,.2);
  cursor:pointer;
  animation:offerPulse 2s infinite;
}

@keyframes offerPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}

.offer-circle span{
  font-size:10px;
  font-weight:900;
  color:#080808;
  text-align:center;
  line-height:1.05;
}

/* ================= CART ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);
  z-index:2000;
}

.drawer{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(440px,100%);
  background:#0c0c0c;
  border-left:1px solid #262626;
  display:flex;
  flex-direction:column;
}

.drawer-head{
  padding:20px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.drawer-title{
  font-family:'Cormorant Garamond',serif;
  font-size:30px;
  font-weight:700;
}

.drawer-body{
  flex:1;
  overflow:auto;
  padding:18px;
}

.cart-item{
  display:flex;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #1d1d1d;
}

.cart-item-image{
  width:62px;
  height:62px;
  border-radius:10px;
  overflow:hidden;
  background:#171717;
  flex:none;
}

.cart-item-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cart-item-info{
  flex:1;
}

.cart-item-name{
  font-size:14px;
  font-weight:700;
}

.cart-item-price{
  color:var(--orange2);
  font-size:13px;
  margin-top:5px;
}

.qty-controls{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.qty-btn{
  width:25px;
  height:25px;
  border:1px solid #333;
  border-radius:7px;
  background:#151515;
  color:#fff;
}

.cart-footer{
  padding:18px;
  border-top:1px solid #222;
}

.total-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin-bottom:10px;
  color:#aaa;
  font-size:13px;
}

.total-row.grand{
  color:#fff;
  font-size:18px;
  font-weight:800;
  padding-top:10px;
  border-top:1px solid #262626;
}

.checkout-btn{
  width:100%;
  margin-top:14px;
  height:50px;
  border:0;
  border-radius:12px;
  background:var(--orange);
  color:#000;
  font-weight:900;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){
  .menu-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .nav-links{
    display:none;
  }
}

@media(max-width:720px){
  .navbar{
    height:68px;
  }

  .logo-text{
    font-size:23px;
  }

  .hero{
    min-height:540px;
  }

  .hero h1{
    font-size:64px;
  }

  section{
    padding:58px 0;
  }

  .section-title{
    font-size:40px;
  }

  .menu-grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .menu-image{
    height:150px;
  }

  .menu-info{
    padding:12px;
  }

  .menu-name{
    font-size:20px;
  }
}

@media(max-width:470px){
  .menu-grid{
    grid-template-columns:1fr;
  }

  .menu-image{
    height:210px;
  }

  .hero h1{
    font-size:56px;
  }
}
